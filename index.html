<!doctype html>
<html lang="kk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Әмиян">
<meta name="theme-color" content="#0f1b33">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Әмиян</title>
<style>
:root{
  --bg:#f2f3f7; --card:#ffffff; --card2:#f7f8fb; --text:#0f172a; --muted:#6b7280; --line:#e6e8ef;
  --brand:#1f3864; --brand2:#3a2a8c; --accent:#ffd666;
  --green:#16a34a; --green-bg:#e8f6ee; --red:#dc2626; --red-bg:#fdecec; --orange:#d97706; --orange-bg:#fff4e0; --blue:#2563eb; --blue-bg:#e8f0fe;
  --shadow:0 1px 2px rgba(15,23,42,.06),0 4px 16px rgba(15,23,42,.06);
  --radius:18px;
  --tabh:64px;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#0b0f1a; --card:#151b2b; --card2:#1b2234; --text:#eef1f7; --muted:#94a3b8; --line:#253047;
    --green-bg:#11291c; --red-bg:#2d1416; --orange-bg:#2c2110; --blue-bg:#14223f; --shadow:none; }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Arial,sans-serif;font-size:16px;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
body{min-height:100vh}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,select,textarea{font:inherit;color:var(--text)}
.app{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 8px) 16px calc(var(--tabh) + env(safe-area-inset-bottom) + 90px)}
/* header */
.top{display:flex;align-items:center;justify-content:space-between;padding:6px 2px 4px}
.top h1{font-size:30px;font-weight:800;letter-spacing:-.6px;margin:0}
.iconbtn{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--card);box-shadow:var(--shadow)}
.iconbtn svg{width:20px;height:20px}
.period{display:flex;align-items:center;justify-content:space-between;background:var(--card);border-radius:14px;padding:6px;margin:8px 0 14px;box-shadow:var(--shadow)}
.period button{width:36px;height:36px;border-radius:10px;font-size:20px;color:var(--muted)}
.period button:active{background:var(--card2)}
.period .pname{text-align:center}
.period .pname b{display:block;font-size:16px}
.period .pname small{color:var(--muted);font-size:12px}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--blue-bg);color:var(--blue);margin-left:6px;vertical-align:middle}
/* hero */
.hero{border-radius:24px;padding:20px;color:#fff;background:linear-gradient(135deg,#1f3864 0%,#3a2a8c 100%);box-shadow:0 10px 30px rgba(31,56,100,.35);position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;right:-40px;top:-40px;width:160px;height:160px;border-radius:50%;background:rgba(255,255,255,.07)}
.hero .lbl{font-size:13px;opacity:.8;font-weight:600}
.hero .big{font-size:38px;font-weight:800;letter-spacing:-1px;margin:4px 0 2px}
.hero .sub{font-size:13px;opacity:.85}
.hero .bar{height:8px;background:rgba(255,255,255,.18);border-radius:99px;margin-top:14px;overflow:hidden}
.hero .bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.hero .barlbl{display:flex;justify-content:space-between;font-size:12px;opacity:.8;margin-top:6px}
.hero.hneg{background:linear-gradient(135deg,#7f1d1d 0%,#3a2a8c 100%)}
/* grid tiles */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.tile{background:var(--card);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow);min-width:0}
.tile .t{font-size:12px;color:var(--muted);font-weight:600;margin-bottom:6px}
.tile .v{font-size:19px;font-weight:800;letter-spacing:-.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .s{font-size:12px;color:var(--muted);margin-top:3px}
.tile.wide{grid-column:1/-1}
.pos{color:var(--green)} .neg{color:var(--red)} .warn{color:var(--orange)}
/* cards / lists */
.sec{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin:22px 4px 8px;display:flex;justify-content:space-between;align-items:center}
.sec a,.sec button{text-transform:none;letter-spacing:0;color:var(--blue);font-weight:600;font-size:14px}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line);min-height:56px}
.row:last-child{border-bottom:0}
.row:active{background:var(--card2)}
.row .ic{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;font-weight:800;font-size:14px;flex:none;color:#fff}
.row .mid{flex:1;min-width:0}
.row .mid b{display:block;font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .mid small{color:var(--muted);font-size:12px}
.row .amt{font-weight:700;white-space:nowrap;text-align:right}
.row .amt small{display:block;font-weight:500;color:var(--muted);font-size:11px}
.kv{display:flex;justify-content:space-between;align-items:center;padding:13px 14px;border-bottom:1px solid var(--line)}
.kv:last-child{border-bottom:0}
.kv span{color:var(--muted);font-size:14px}
.kv b{font-weight:700}
.chk{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;flex:none;transition:.15s}
.chk.on{background:var(--green);border-color:var(--green)}
.chk.on:after{content:"";width:7px;height:12px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.done b{text-decoration:line-through;color:var(--muted)}
.chip{display:inline-block;font-size:11px;font-weight:700;padding:3px 8px;border-radius:99px}
.chip.r{background:var(--red-bg);color:var(--red)} .chip.g{background:var(--green-bg);color:var(--green)} .chip.o{background:var(--orange-bg);color:var(--orange)} .chip.b{background:var(--blue-bg);color:var(--blue)}
.empty{padding:26px 16px;text-align:center;color:var(--muted);font-size:14px}
.alert{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:14px;margin-top:10px;font-size:14px;line-height:1.35}
.alert.r{background:var(--red-bg);color:var(--red)} .alert.o{background:var(--orange-bg);color:var(--orange)} .alert.b{background:var(--blue-bg);color:var(--blue)}
.alert b{font-weight:700}
.catbar{padding:12px 14px;border-bottom:1px solid var(--line)}
.catbar:last-child{border-bottom:0}
.catbar .h{display:flex;justify-content:space-between;font-size:14px;margin-bottom:6px}
.catbar .h span{color:var(--muted)}
.catbar .b{height:7px;background:var(--card2);border-radius:99px;overflow:hidden}
.catbar .b i{display:block;height:100%;border-radius:99px}
.seg{display:flex;background:var(--card2);border-radius:12px;padding:3px;margin-bottom:12px}
.seg button{flex:1;padding:8px;border-radius:9px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--text);box-shadow:var(--shadow)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;padding:7px 12px;border-radius:99px;background:var(--card);box-shadow:var(--shadow);font-size:13px;font-weight:600;color:var(--muted)}
.chips button.on{background:var(--brand);color:#fff}
.btn{display:block;width:100%;padding:14px;border-radius:14px;font-weight:700;text-align:center;background:var(--brand);color:#fff;margin-top:10px}
.btn.ghost{background:var(--card);color:var(--blue);box-shadow:var(--shadow)}
.btn.danger{background:var(--red-bg);color:var(--red)}
.btn:active{opacity:.8}
/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb,var(--card) 82%,transparent);backdrop-filter:saturate(180%) blur(18px);-webkit-backdrop-filter:saturate(180%) blur(18px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabs .in{max-width:560px;margin:0 auto;display:flex;height:var(--tabh)}
.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10.5px;font-weight:600;color:var(--muted)}
.tabs button svg{width:24px;height:24px}
.tabs button.on{color:var(--brand)}
@media (prefers-color-scheme: dark){.tabs button.on{color:#8fb1ff}}
.fab{position:fixed;right:20px;bottom:calc(var(--tabh) + env(safe-area-inset-bottom) + 16px);z-index:21;width:58px;height:58px;border-radius:50%;background:linear-gradient(135deg,#1f3864,#3a2a8c);color:#fff;font-size:32px;font-weight:300;display:grid;place-items:center;box-shadow:0 8px 24px rgba(31,56,100,.45)}
.fab:active{transform:scale(.94)}
/* sheet */
.mask{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:40;opacity:0;pointer-events:none;transition:.2s}
.mask.on{opacity:1;pointer-events:auto}
.sheet{visibility:hidden;position:fixed;left:0;right:0;bottom:0;z-index:41;max-width:560px;margin:0 auto;background:var(--bg);border-radius:22px 22px 0 0;transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.8,.2,1);max-height:92vh;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom)}
.sheet.on{transform:none;visibility:visible}
.sheet .grab{width:38px;height:5px;border-radius:9px;background:var(--line);margin:8px auto 2px}
.sheet .sh{display:flex;justify-content:space-between;align-items:center;padding:6px 16px 10px}
.sheet .sh b{font-size:18px}
.sheet .sh button{color:var(--blue);font-weight:600}
.sheet .sb{overflow:auto;padding:0 16px 18px}
.field{background:var(--card);border-radius:14px;margin-bottom:10px;padding:10px 14px;box-shadow:var(--shadow)}
.field label{display:block;font-size:12px;color:var(--muted);font-weight:600;margin-bottom:4px}
.field input,.field select,.field textarea{width:100%;border:0;outline:0;background:transparent;font-size:17px;padding:2px 0}
.field input.bigin{font-size:34px;font-weight:800;letter-spacing:-.5px}
.field .row2{display:flex;gap:10px}
.toggle{display:flex;justify-content:space-between;align-items:center}
.toggle input{width:auto;transform:scale(1.3)}
.catpick{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 10px}
.catpick button{padding:8px 12px;border-radius:99px;background:var(--card);box-shadow:var(--shadow);font-size:14px;font-weight:600}
.catpick button.on{background:var(--brand);color:#fff}
.note{font-size:12px;color:var(--muted);line-height:1.45;margin:6px 4px 10px}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 12px);transform:translate(-50%,-150%);background:#111827;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;font-weight:600;z-index:60;transition:.25s;box-shadow:0 8px 20px rgba(0,0,0,.25)}
.toast.on{transform:translate(-50%,0)}
.mgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:12px}
.mgrid button{padding:9px 4px;border-radius:10px;background:var(--card2);font-size:12px;font-weight:700}
.mgrid button.ok{background:var(--green-bg);color:var(--green)}
.mgrid button.due{background:var(--red-bg);color:var(--red)}
.mgrid button.cur{outline:2px solid var(--brand)}
.hidden{display:none!important}
</style>
</head>
<body>
<div class="app" id="app"></div>
<div class="fab" id="fab" onclick="addExpense()">+</div>
<nav class="tabs"><div class="in" id="tabs"></div></nav>
<div class="mask" id="mask" onclick="closeSheet()"></div>
<div class="sheet" id="sheet"><div class="grab"></div><div class="sh"><button onclick="closeSheet()">Жабу</button><b id="shTitle"></b><button id="shSave">Сақтау</button></div><div class="sb" id="shBody"></div></div>
<div class="toast" id="toast"></div>
<input type="file" id="fileIn" accept="application/json,.json" class="hidden">
<script>
"use strict";
const KEY="amiyan.v1";
const MONTHS=["Қаңтар","Ақпан","Наурыз","Сәуір","Мамыр","Маусым","Шілде","Тамыз","Қыркүйек","Қазан","Қараша","Желтоқсан"];
const MSHORT=["Қаң","Ақп","Нау","Сәу","Мам","Мау","Шіл","Там","Қыр","Қаз","Қар","Жел"];
const CATS=[["Тамақ","#16a34a"],["Көлік","#0ea5e9"],["Тұрғын үй","#6366f1"],["Байланыс","#14b8a6"],["Бала","#ec4899"],["Киім","#a855f7"],["Денсаулық","#ef4444"],["Ойын-сауық","#f59e0b"],["Сыйлық","#f97316"],["Несие","#7c3aed"],["Himmet","#15803d"],["Резерв","#64748b"],["Белгісіз","#9ca3af"],["Басқа","#475569"]];
const catColor=c=>(CATS.find(x=>x[0]===c)||["","#475569"])[1];
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=n=>{n=Math.round(+n||0);const s=Math.abs(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g," ");return (n<0?"−":"")+s+" ₸"};
const num=v=>{const x=parseFloat(String(v).replace(/\s/g,"").replace(",","."));return isNaN(x)?0:x};
// dates (local, ISO yyyy-mm-dd)
const pad=n=>String(n).padStart(2,"0");
const iso=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const pd=s=>{const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)};
const todayIso=()=>iso(new Date());
const addDays=(s,n)=>{const d=pd(s);d.setDate(d.getDate()+n);return iso(d)};
const addMonths=(s,n,day)=>{const d=pd(s);const want=day||d.getDate();const t=new Date(d.getFullYear(),d.getMonth()+n,1);const last=new Date(t.getFullYear(),t.getMonth()+1,0).getDate();t.setDate(Math.min(want,last));return iso(t)};
const dmy=s=>{if(!s)return"";const d=pd(s);return pad(d.getDate())+"."+pad(d.getMonth()+1)+"."+d.getFullYear()};
const dShort=s=>{const d=pd(s);return d.getDate()+" "+MSHORT[d.getMonth()]};
const ym=s=>s.slice(0,7);
const ymName=k=>{const [y,m]=k.split("-").map(Number);return MONTHS[m-1]+" "+y};
const daysBetween=(a,b)=>Math.round((pd(b)-pd(a))/86400000);

// ---------- seed (data from your Google Sheet) ----------
function seed(){
  const T=[["Halyk кредит 1","Несие",92000],["Halyk кредит 2","Несие",55000],["Kaspi рассрочка","Несие",53000],["Kaspi Red","Несие",40000],["Пәтер","Тұрғын үй",160000],["Коммуналка","Тұрғын үй",20000],["Тариф (байланыс)","Байланыс",10000],["Балабақша","Бала",60000],["Азық-түлік","Тамақ",30000],["Himmet жарнасы","Himmet",20000],["Такси","Көлік",15000],["Күтпеген шығындар","Резерв",25000]];
  const paid=[1,1,1,1,1,0,0,1,0,1,0,0];
  const template=T.map(t=>({id:uid(),name:t[0],cat:t[1],amount:t[2]}));
  const p0="2026-10-27";
  const members=[["Ilkham aga",50000],["Abeke",20000],["Shyngys aga",15000],["Seilkhan aga",30000],["Hasanbi aga",20000],["Marat aga",10000],["Ali aga",15000],["Nurdaulet aga",15000],["Daniyar",20000],["Iliyas aga",30000],["Nurbibi apay",15000],["Umit apay",15000],["Symbat apay",15000],["Nuray apay",10000]].map(m=>({id:uid(),name:m[0],monthly:m[1]}));
  const pay={};members.forEach((m,i)=>{pay[m.id]={"2026-09":m.monthly};if(i>0)pay[m.id]["2026-10"]=m.monthly});
  const D=(kind,who,amount,date,due,note)=>({id:uid(),kind,who,amount,date,due,returned:false,note});
  return {
    v:1,
    set:{salary:670000,payday:27,bank:616000,opening:0},
    periods:[{start:p0,salary:670000,other:0}],
    template,
    mand:{[p0]:template.map((t,i)=>({id:uid(),tid:t.id,name:t.name,cat:t.cat,amount:t.amount,paid:!!paid[i]}))},
    exp:[0,1,2,3].map(i=>({id:uid(),date:"2026-11-01",amount:[54545,54545,54544,54544][i],cat:"Белгісіз",note:"Белгісіз шығындар"})),
    debts:[D("taken","Meirman",20000,"2024-03-30","2026-12-30","Қарыз алғанымды ұмытып қалған сияқты"),D("taken","Berik",10000,"2024-03-31","2026-12-31","Қарыз алғанымды ұмытып қалған сияқты"),
           D("given","Sunkar",70000,"2026-10-29","2026-11-30","Қайтару керек"),D("given","Mama",30000,"2026-10-24","2026-10-31","Қайтару керек"),D("given","Alibi",10000,"2026-08-25","2026-10-31","Сұрау керек"),D("given","Zhalgas",10000,"2026-08-25","2026-10-31","Сұрау керек"),D("given","Akzhol",20000,"2025-12-25","2026-10-31","Сұрау керек")],
    himmet:{start:"2026-09",members,pay},
    wallets:defWallets(204178,30000),
    students:{count:9,per:1000,start:"2026-11",recv:{},acts:[]},
    ui:{tab:"home"}
  };
}
function defWallets(t,r){return [{id:"him",type:"himmet",name:"Himmet",adj:0,color:"#15803d"},{id:uid(),type:"manual",name:"Target",amount:t,color:"#2563eb"},{id:uid(),type:"manual",name:"Rehber",amount:r,color:"#d97706"},{id:"stu",type:"students",name:"Оқушылар ақшасы",adj:0,color:"#0e7490"}]}
function migrate(){if(S.wallets&&!Array.isArray(S.wallets))S.wallets=defWallets(num(S.wallets.target),num(S.wallets.rehber))}
const WCOLORS=["#2563eb","#d97706","#15803d","#0e7490","#7c3aed","#db2777","#dc2626","#475569"];
let S;
function load(){try{const r=localStorage.getItem(KEY);return r?JSON.parse(r):null}catch(e){return null}}
function save(){S.updated=Date.now();try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast("Сақтау мүмкін болмады")}}
S=load()||seed();migrate();
if(navigator.storage&&navigator.storage.persist){navigator.storage.persist().catch(()=>{})}

// ---------- periods ----------
function pEnd(i){return i<S.periods.length-1?addDays(S.periods[i+1].start,-1):addDays(addMonths(S.periods[i].start,1,S.set.payday),-1)}
function pName(i){const d=pd(S.periods[i].start);return MONTHS[d.getMonth()]+" "+d.getFullYear()}
function initMand(start){if(!S.mand[start])S.mand[start]=S.template.map(t=>({id:uid(),tid:t.id,name:t.name,cat:t.cat,amount:t.amount,paid:false}))}
function ensurePeriods(){
  let added=false;const t=todayIso();
  while(t>pEnd(S.periods.length-1)){const last=S.periods[S.periods.length-1];const st=addMonths(last.start,1,S.set.payday);S.periods.push({start:st,salary:S.set.salary,other:0});initMand(st);added=true}
  S.periods.forEach(p=>initMand(p.start));
  if(added)save();
}
function curIdx(){const t=todayIso();for(let i=S.periods.length-1;i>=0;i--)if(S.periods[i].start<=t)return i;return 0}
let view=null;
function calc(i){
  const p=S.periods[i],st=p.start,en=pEnd(i);
  const opening=i===0?num(S.set.opening):calc(i-1).closing;
  const items=S.mand[st]||[];
  const mand=items.reduce((a,x)=>a+num(x.amount),0);
  const mandPaid=items.filter(x=>x.paid).reduce((a,x)=>a+num(x.amount),0);
  const exps=S.exp.filter(e=>e.date>=st&&e.date<=en);
  const other=exps.reduce((a,e)=>a+num(e.amount),0);
  const given=S.debts.filter(d=>d.kind==="given"&&d.date>=st&&d.date<=en).reduce((a,d)=>a+num(d.amount),0);
  const taken=S.debts.filter(d=>d.kind==="taken"&&d.date>=st&&d.date<=en).reduce((a,d)=>a+num(d.amount),0);
  const income=num(p.salary)+num(p.other);
  const closing=opening+income-mand-other-(given-taken);
  return {st,en,opening,income,mand,mandPaid,unpaid:mand-mandPaid,other,exps,loans:given-taken,closing};
}
// ---------- wallets ----------
function curYm(){return ym(todayIso())}
function monthsFrom(start,toYm){const out=[];let [y,m]=start.split("-").map(Number);const [ty,tm]=toYm.split("-").map(Number);while(y<ty||(y===ty&&m<=tm)){out.push(y+"-"+pad(m));m++;if(m>12){m=1;y++}}return out}
function himmet(){
  const H=S.himmet,ms=monthsFrom(H.start,curYm());
  let collected=0,owed=0,monthly=0,paidThis=0;const cm=curYm();
  H.members.forEach(m=>{const p=H.pay[m.id]||{};const paid=Object.values(p).reduce((a,v)=>a+num(v),0);collected+=paid;monthly+=num(m.monthly);owed+=Math.max(0,num(m.monthly)*ms.length-paid);if(num(p[cm])>0)paidThis++});
  return {collected,owed,monthly,paidThis,count:H.members.length,ms};
}
function students(){
  const St=S.students,ms=monthsFrom(St.start,curYm());
  const exp=num(St.count)*num(St.per);
  let recv=0,pending=0;
  Object.entries(St.recv).forEach(([k,v])=>{if(v&&v.ok)recv+=num(v.amount??exp)});
  ms.forEach(k=>{if(!(St.recv[k]&&St.recv[k].ok))pending+=exp});
  const spent=St.acts.reduce((a,x)=>a+num(x.amount),0);
  return {recv,spent,bal:recv-spent,pending,exp};
}
function wBase(w){return w.type==="himmet"?himmet().collected:w.type==="students"?students().bal:0}
function wAmt(w){return w.type==="manual"?num(w.amount):wBase(w)+num(w.adj)}
const hasW=t=>S.wallets.some(w=>w.type===t);
const wName=t=>(S.wallets.find(w=>w.type===t)||{name:t}).name;
function walletsTotal(){return S.wallets.reduce((a,w)=>a+wAmt(w),0)}
function debtsSum(kind){return S.debts.filter(d=>d.kind===kind&&!d.returned).reduce((a,d)=>a+num(d.amount),0)}

    body=`<div class="grid" style="margin-top:0"><div class="tile" onclick="editWallet('him')"><div class="t">Жиналған ✎</div><div class="v pos">${fmt(wAmt(S.wallets.find(w=>w.type==="himmet")||{type:"himmet"}))}</div>${num((S.wallets.find(w=>w.type==="himmet")||{}).adj)?'<div class="s">түзетумен</div>':""}</div><div class="tile"><div class="t">Төленбеген</div><div class="v ${H.owed?"neg":""}">${fmt(H.owed)}</div></div><div class="tile"><div class="t">Айына</div><div class="v">${fmt(H.monthly)}</div></div><div class="tile"><div class="t">${ymName(curYm())}</div><div class="v">${H.paidThis} / ${H.count}</div></div></div>
    <div class="sec">Ай</div><div class="chips">${ms.map(k=>`<button class="${k===himYm?"on":""}" onclick="himYm='${k}';render()">${ymName(k)}</button>`).join("")}</div>
    <div class="card">${S.himmet.members.map(m=>{const p=num((S.himmet.pay[m.id]||{})[himYm]);const st=p>=num(m.monthly)?'<span class="chip g">Төледі</span>':p>0?'<span class="chip o">Жартылай</span>':(himYm<=curYm()?'<span class="chip r">Төлемеді</span>':'<span class="chip b">Күтілуде</span>');return `<div class="row"><div class="chk ${p>=num(m.monthly)?"on":""}" onclick="himToggle('${m.id}')"></div><div class="mid" onclick="himEdit('${m.id}')"><b>${esc(m.name)}</b><small>Жарна ${fmt(m.monthly)}</small></div><div class="amt" onclick="himEdit('${m.id}')">${p?fmt(p):"—"}<small>${st}</small></div></div>`}).join("")}</div>
    <button class="btn ghost" onclick="himMember()">+ Адам қосу</button>`;
  } else {
    const ms=monthsFrom(S.students.start,addMonths(curYm()+"-01",4).slice(0,7));
    body=`<div class="grid" style="margin-top:0"><div class="tile"><div class="t">Түскен</div><div class="v pos">${fmt(St.recv)}</div></div><div class="tile"><div class="t">Жұмсалды</div><div class="v neg">${fmt(St.spent)}</div></div><div class="tile" onclick="editWallet('stu')"><div class="t">Қалдық ✎</div><div class="v">${fmt(wAmt(S.wallets.find(w=>w.type==="students")||{type:"students"}))}</div></div><div class="tile" onclick="stuSettings()"><div class="t">Оқушы × сома ✎</div><div class="v">${S.students.count} × ${fmt(S.students.per)}</div></div></div>
    <div class="sec">Ай сайынғы түсім</div><div class="card"><div class="mgrid">${ms.map(k=>{const r=S.students.recv[k];const ok=r&&r.ok;return `<button class="${ok?"ok":(k<=curYm()?"due":"")} ${k===curYm()?"cur":""}" onclick="stuToggle('${k}')">${MSHORT[+k.slice(5)-1]} ${k.slice(2,4)}<br>${ok?"✓":fmt(St.exp).replace(" ₸","")}</button>`}).join("")}</div></div>
    <p class="note">Айды басыңыз — «түсті» болып белгіленеді. Қызыл — уақыты өтсе де әлі түспеген.</p>
    <div class="sec">Іс-шаралар есебі <button onclick="actEdit()">+ Қосу</button></div>
    <div class="card">${S.students.acts.length?[...S.students.acts].sort((a,b)=>b.date.localeCompare(a.date)).map(a=>`<div class="row" onclick="actEdit('${a.id}')"><div class="ic" style="background:#0e7490">${num(a.n)}</div><div class="mid"><b>${esc(a.name)}</b><small>${dmy(a.date)} · ${num(a.n)} оқушы${num(a.n)?" · біріне "+fmt(num(a.amount)/num(a.n)):""}</small></div><div class="amt">${fmt(a.amount)}</div></div>`).join(""):'<div class="empty">Әлі іс-шара жоқ</div>'}</div>`;
  }
  return header("Әмияндар")+`<div class="seg"><button class="${walSeg==="sum"?"on":""}" onclick="walSeg='sum';render()">Жалпы</button>${hasW("himmet")?`<button class="${walSeg==="him"?"on":""}" onclick="walSeg='him';render()">${esc(wName("himmet"))}</button>`:""}${hasW("students")?`<button class="${walSeg==="stu"?"on":""}" onclick="walSeg='stu';render()">${esc(wName("students").split(" ")[0])}</button>`:""}</div>`+body;
}
let pickedColor;
function editWallet(id){const isNew=!id;const w=isNew?{type:"manual",name:"",amount:"",color:WCOLORS[S.wallets.length%WCOLORS.length]}:S.wallets.find(x=>x.id===id);pickedColor=w.color;const calc=w.type!=="manual";
 openSheet(isNew?"Жаңа әмиян":"Әмиянды өзгерту",`${field("Атауы","wName",w.name,"text",isNew?"autofocus":"")}${field("Ішіндегі сома (₸)","wAmt",isNew?"":wAmt(w),"number",isNew?"":"autofocus")}
 ${calc?`<p class="note">Бұл сома ${w.type==="himmet"?"жарналардан":"түсім мен іс-шаралардан"} өзі есептеледі (${fmt(wBase(w))}). Басқа сома жазсаңыз, айырмасы түзету ретінде сақталады${num(w.adj)?` — қазіргі түзету ${fmt(w.adj)}`:""}.</p>`:""}
 <div class="field"><label>Түсі</label><div class="catpick" id="colpick" style="margin:6px 0 2px">${WCOLORS.map(c=>`<button type="button" class="${c===w.color?"on":""}" style="width:34px;height:34px;padding:0;background:${c};${c===w.color?"outline:3px solid var(--text);outline-offset:2px":""}" onclick="pickColor(this,'${c}')"></button>`).join("")}</div></div>
 ${calc&&num(w.adj)?`<button class="btn ghost" onclick="wReset('${w.id}')">Түзетуді алып тастау</button>`:""}
 ${!isNew?`<div class="field"><label>Тез өзгерту: сома жазып, батырманы басыңыз</label><div class="row2"><input id="wDelta" type="number" inputmode="decimal" placeholder="0" style="flex:1"><button type="button" class="chip g" style="padding:8px 14px;font-size:14px" onclick="wDelta(1)">+ Салу</button><button type="button" class="chip r" style="padding:8px 14px;font-size:14px" onclick="wDelta(-1)">− Алу</button></div></div>`:""}
 ${!isNew?`<button class="btn danger" onclick="wDel('${w.id}')">Әмиянды өшіру</button>`:""}`,()=>{const n=val("wName").trim();if(!n){toast("Атауын жазыңыз");return false}const a=num(val("wAmt"));
  if(isNew){S.wallets.push({id:uid(),type:"manual",name:n,amount:a,color:pickedColor});toast("Әмиян қосылды");return}
  w.name=n;w.color=pickedColor;if(calc){if(val("wAmt")!=="")w.adj=a-wBase(w)}else w.amount=a})}
function wDelta(sg){const d=num(val("wDelta"))*sg;if(!d)return;$("wAmt").value=num(val("wAmt"))+d;$("wDelta").value="";toast((sg>0?"+":"−")+fmt(Math.abs(d)).replace("−","")+" · «Сақтау» басыңыз")}
function pickColor(b,c){pickedColor=c;document.querySelectorAll("#colpick button").forEach(x=>x.style.outline="");b.style.outline="3px solid var(--text)";b.style.outlineOffset="2px"}
function wRestore(){if(!hasW("himmet"))S.wallets.unshift({id:"him",type:"himmet",name:"Himmet",adj:0,color:"#15803d"});if(!hasW("students"))S.wallets.push({id:"stu",type:"students",name:"Оқушылар ақшасы",adj:0,color:"#0e7490"});closeSheet();save();render();toast("Қайтарылды")}
function wReset(id){const w=S.wallets.find(x=>x.id===id);w.adj=0;closeSheet();save();render();toast("Түзету алынды")}
function wDel(id){const w=S.wallets.find(x=>x.id===id);if(!confirm(`«${w.name}» әмиянын өшіру керек пе?`+(w.type!=="manual"?" (Төлемдер тарихы сақталады, Баптаулардан қайта қосуға болады)":"")))return;S.wallets=S.wallets.filter(x=>x.id!==id);closeSheet();save();render();toast("Өшірілді")}
function himToggle(mid){const p=S.himmet.pay[mid]=S.himmet.pay[mid]||{};const m=S.himmet.members.find(x=>x.id===mid);if(num(p[himYm])>=num(m.monthly))delete p[himYm];else p[himYm]=num(m.monthly);save();render()}
function himEdit(mid){const m=S.himmet.members.find(x=>x.id===mid);const p=S.himmet.pay[mid]=S.himmet.pay[mid]||{};openSheet(m.name,`${field(ymName(himYm)+" төлегені (₸)","hPay",p[himYm]||"","number","autofocus")}${field("Аты","hName",m.name)}${field("Ай сайынғы жарна (₸)","hMon",m.monthly,"number")}<button class="btn danger" onclick="himDel('${mid}')">Тізімнен өшіру</button>`,()=>{const v=num(val("hPay"));if(v>0)p[himYm]=v;else delete p[himYm];m.name=val("hName").trim()||m.name;m.monthly=num(val("hMon"))})}
function himMember(){openSheet("Жаңа адам",field("Аты","hName","","text","autofocus")+field("Ай сайынғы жарна (₸)","hMon","","number"),()=>{const n=val("hName").trim();if(!n){toast("Атын жазыңыз");return false}S.himmet.members.push({id:uid(),name:n,monthly:num(val("hMon"))})})}
function himDel(mid){if(!confirm("Бұл адамды және оның төлемдерін өшіру керек пе?"))return;S.himmet.members=S.himmet.members.filter(m=>m.id!==mid);delete S.himmet.pay[mid];closeSheet();save();render()}
function stuToggle(k){const r=S.students.recv[k];if(r&&r.ok){delete S.students.recv[k]}else{S.students.recv[k]={ok:true,date:todayIso(),amount:num(S.students.count)*num(S.students.per)}}save();render()}
function stuSettings(){openSheet("Оқушылар",field("Оқушы саны","sCnt",S.students.count,"number","autofocus")+field("Бір оқушыға (₸)","sPer",S.students.per,"number")+`<p class="note">Өзгеріс әлі түспеген айларға қолданылады.</p>`,()=>{S.students.count=num(val("sCnt"));S.students.per=num(val("sPer"))})}
function actEdit(id){const a=id?S.students.acts.find(x=>x.id===id):{name:"",date:todayIso(),n:"",amount:"",note:""};openSheet(id?"Іс-шара":"Жаңа іс-шара",`${field("Іс-шара атауы","aName",a.name,"text",id?"":"autofocus")}<div class="field"><div class="row2"><div style="flex:1"><label>Күні</label><input id="aDate" type="date" value="${a.date}"></div><div style="flex:1"><label>Қатысқан оқушы</label><input id="aN" type="number" inputmode="numeric" value="${esc(a.n)}"></div></div></div>${field("Жұмсалған сома (₸)","aAmt",a.amount,"number")}${field("Ескерту","aNote",a.note)}${id?`<button class="btn danger" onclick="actDel('${id}')">Өшіру</button>`:""}`,()=>{const n=val("aName").trim();if(!n){toast("Атауын жазыңыз");return false}const o={name:n,date:val("aDate")||todayIso(),n:num(val("aN")),amount:num(val("aAmt")),note:val("aNote")};if(id)Object.assign(a,o);else S.students.acts.push({id:uid(),...o})})}
function actDel(id){if(!confirm("Өшіру керек пе?"))return;S.students.acts=S.students.acts.filter(x=>x.id!==id);closeSheet();save();render()}

let debtSeg="given";
function vDebt(){
  const own=num(S.set.bank)-walletsTotal();
  const list=S.debts.filter(d=>d.kind===debtSeg).sort((a,b)=>(a.returned-b.returned)||((a.due||"9")).localeCompare(b.due||"9"));
  const open=list.filter(d=>!d.returned).reduce((a,d)=>a+num(d.amount),0);
  return header("Қарыздар")+`<div class="seg"><button class="${debtSeg==="given"?"on":""}" onclick="debtSeg='given';render()">Мен бердім</button><button class="${debtSeg==="taken"?"on":""}" onclick="debtSeg='taken';render()">Мен алдым</button></div>
  <div class="grid" style="margin-top:0"><div class="tile"><div class="t">${debtSeg==="given"?"Маған қайтарылады":"Мен қайтарамын"}</div><div class="v ${debtSeg==="given"?"pos":"neg"}">${fmt(open)}</div></div><div class="tile"><div class="t">Himmet-ке қарыз</div><div class="v ${own<0?"neg":"pos"}">${fmt(Math.max(0,-own))}</div><div class="s">автоматты</div></div></div>
  <div class="sec">Тізім <button onclick="debtEdit()">+ Қосу</button></div>
  <div class="card">${list.length?list.map(d=>`<div class="row ${d.returned?"done":""}"><div class="chk ${d.returned?"on":""}" onclick="debtToggle('${d.id}')"></div><div class="mid" onclick="debtEdit('${d.id}')"><b>${esc(d.who)}</b><small>${dmy(d.date)}${d.due?" → "+dmy(d.due):""}${d.note?" · "+esc(d.note):""}</small></div><div class="amt" onclick="debtEdit('${d.id}')">${fmt(d.amount)}<small>${statusChip(d)}</small></div></div>`).join(""):'<div class="empty">Тізім бос</div>'}</div>
  <p class="note">Дөңгелекті бассаңыз — «қайтарылды» болады. Жаңа берген/алған қарыз сол кезеңнің қалдығына әсер етеді.</p>`;
}
function debtToggle(id){const d=S.debts.find(x=>x.id===id);d.returned=!d.returned;save();render();toast(d.returned?"Қайтарылды деп белгіленді":"Қайтадан ашық")}
function debtEdit(id){const d=id?S.debts.find(x=>x.id===id):{kind:debtSeg,who:"",amount:"",date:todayIso(),due:"",note:""};openSheet(id?"Қарыз":(debtSeg==="given"?"Қарыз бердім":"Қарыз алдым"),`${field(d.kind==="given"?"Кімге":"Кімнен","dWho",d.who,"text",id?"":"autofocus")}${field("Сома (₸)","dAmt",d.amount,"number")}<div class="field"><div class="row2"><div style="flex:1"><label>${d.kind==="given"?"Берген күні":"Алған күні"}</label><input id="dDate" type="date" value="${d.date}"></div><div style="flex:1"><label>Қайтару мерзімі</label><input id="dDue" type="date" value="${d.due||""}"></div></div></div>${field("Ескерту","dNote",d.note)}${id?`<button class="btn danger" onclick="debtDel('${id}')">Өшіру</button>`:""}`,()=>{const w=val("dWho").trim();if(!w){toast("Атын жазыңыз");return false}const o={who:w,amount:num(val("dAmt")),date:val("dDate")||todayIso(),due:val("dDue"),note:val("dNote")};if(id)Object.assign(d,o);else S.debts.push({id:uid(),kind:d.kind,returned:false,...o})})}
function debtDel(id){if(!confirm("Өшіру керек пе?"))return;S.debts=S.debts.filter(x=>x.id!==id);closeSheet();save();render()}

function editBank(){openSheet("Банк шотында",field("Қазіргі қалдық (₸)","bAmt",S.set.bank,"number","class='bigin' autofocus")+`<p class="note">Kaspi/Halyk қосымшасындағы нақты соманы жазыңыз. Әмияндармен салыстыру осыған қарап есептеледі.</p>`,()=>{S.set.bank=num(val("bAmt"))})}
function editPeriod(){const p=S.periods[view];openSheet(pName(view),`${field("Жалақы (₸)","pSal",p.salary,"number","autofocus")}${field("Басқа кіріс (₸)","pOth",p.other,"number")}${field("Жалақы түскен күн (кезең басы)","pSt",p.start,"date",view===0?"":"")}${view===0?field("Бастапқы қалдық (бірінші кезең)","pOpen",S.set.opening,"number"):""}<p class="note">Кезең соңы келесі жалақы күніне дейін өзі есептеледі. Қалдық келесі айға автоматты ауысады.</p>`,()=>{p.salary=num(val("pSal"));p.other=num(val("pOth"));const ns=val("pSt");if(ns&&ns!==p.start){const prev=S.periods[view-1],next=S.periods[view+1];if((prev&&ns<=prev.start)||(next&&ns>=next.start)){toast("Күн көрші кезеңдермен сәйкес келмейді");return false}S.mand[ns]=S.mand[p.start];delete S.mand[p.start];p.start=ns}if(view===0)S.set.opening=num(val("pOpen"))})}
function newSalary(){openSheet("Жаңа жалақы түсті",`${field("Сомасы (₸)","nsAmt",S.set.salary,"number","class='bigin' autofocus")}${field("Түскен күні","nsDate",todayIso(),"date")}<p class="note">Жаңа кезең басталады: өткен айдың қалдығы осыған ауысады, міндетті шығындар тізімі жаңадан жасалады, басты беттегі шығындар тазарады (ескілері сақталады).</p>`,()=>{const d=val("nsDate")||todayIso(),a=num(val("nsAmt"));const last=S.periods[S.periods.length-1];
  const ex=S.periods.findIndex(p=>p.start===d);if(ex>=0){S.periods[ex].salary=a;view=ex;return}
  if(d<=last.start){const i=S.periods.findIndex((p,j)=>p.start<=d&&(j===S.periods.length-1||S.periods[j+1].start>d));if(d>S.periods[i].start){S.periods.splice(i+1,0,{start:d,salary:a,other:0});initMand(d)}view=curIdx();return}
  S.periods.push({start:d,salary:a,other:0});initMand(d);view=S.periods.length-1;toast("Жаңа кезең басталды")},"Бастау")}
function settings(){openSheet("Баптаулар",`

   <div class="row" onclick="newSalary()"><div class="ic" style="background:#16a34a">₸</div><div class="mid"><b>Жаңа жалақы түсті</b><small>Жаңа айды бастау</small></div></div>
   <div class="row" onclick="editPeriod()"><div class="ic" style="background:#3a2a8c">✎</div><div class="mid"><b>Осы кезеңді өзгерту</b><small>${pName(view)}: жалақы, күні</small></div></div>
   <div class="row" onclick="editBank()"><div class="ic" style="background:#2563eb">🏦</div><div class="mid"><b>Банк шотындағы сома</b><small>${fmt(S.set.bank)}</small></div></div>
  </div>
  ${field("Әдеттегі жалақы (₸)","sSal",S.set.salary,"number")}${field("Жалақы күні (айдың)","sDay",S.set.payday,"number")}
  <div class="sec">Деректер</div>
  <div class="card">
   <div class="row" onclick="exportJSON()"><div class="ic" style="background:#0f766e">⇩</div><div class="mid"><b>Сақтық көшірме жасау</b><small>Файлды iCloud Drive-қа сақтаңыз</small></div></div>
   <div class="row" onclick="$('fileIn').click()"><div class="ic" style="background:#7c3aed">⇧</div><div class="mid"><b>Көшірмеден қалпына келтіру</b><small>.json файлын таңдаңыз</small></div></div>
   <div class="row" onclick="exportCSV()"><div class="ic" style="background:#15803d">▦</div><div class="mid"><b>Google Sheets-ке экспорт (CSV)</b><small>Шығындар мен айлар есебі</small></div></div>
  </div>
  ${!hasW("himmet")||!hasW("students")?`<button class="btn ghost" onclick="wRestore()">Himmet / Оқушылар әмиянын қайтару</button>`:""}
  <p class="note">Барлық дерек тек осы iPhone-да сақталады, интернет пен тіркелу қажет емес. Айына бір рет сақтық көшірме жасап қойыңыз.</p>
  <button class="btn danger" onclick="resetAll()">Барлық деректі өшіру</button>
  <p class="note" style="text-align:center">Әмиян · нұсқа 1.0</p>`,()=>{S.set.salary=num(val("sSal"));S.set.payday=Math.min(28,Math.max(1,num(val("sDay"))||27))})}
async function shareFile(name,text,type){const blob=new Blob([text],{type});const file=new File([blob],name,{type});if(navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file],title:name});return}catch(e){if(e.name==="AbortError")return}}const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000)}
function exportJSON(){shareFile("amiyan-"+todayIso()+".json",JSON.stringify(S,null,1),"application/json")}
function csvCell(v){v=String(v??"");return /[",;\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}
function exportCSV(){
  let out="Күні,Санат,Сипаттама,Сома\n"+[...S.exp].sort((a,b)=>a.date.localeCompare(b.date)).map(e=>[dmy(e.date),e.cat,e.note,e.amount].map(csvCell).join(",")).join("\n");
  out+="\n\nКезең,Басы,Соңы,Өткен айдан,Кіріс,Міндетті,Басқа шығын,Қарыз (таза),Қалдық\n"+S.periods.map((p,i)=>{const c=calc(i);return [pName(i),dmy(c.st),dmy(c.en),c.opening,c.income,c.mand,c.other,c.loans,c.closing].map(csvCell).join(",")}).join("\n");
  shareFile("amiyan-"+todayIso()+".csv","﻿"+out,"text/csv")}
$("fileIn").onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.periods||!d.set)throw 0;if(!confirm("Қазіргі деректер көшірмедегімен ауыстырылады. Жалғастыру керек пе?"))return;S=d;save();closeSheet();view=null;render();toast("Қалпына келтірілді")}catch(err){toast("Файл дұрыс емес")}};r.readAsText(f);e.target.value=""};
function resetAll(){if(!confirm("Барлық дерек өшеді. Алдымен сақтық көшірме жасадыңыз ба?"))return;if(!confirm("Шынымен өшіру керек пе?"))return;localStorage.removeItem(KEY);S=seed();S.exp=[];S.debts=[];save();closeSheet();view=null;render()}

// ---------- render ----------
function render(){
  ensurePeriods();
  if(view===null||view>=S.periods.length)view=curIdx();
  const t=S.ui.tab;
  $("app").innerHTML=t==="home"?vHome():t==="exp"?vExp():t==="mand"?vMand():t==="wal"?vWal():vDebt();
  renderTabs();
}
document.addEventListener("visibilitychange",()=>{if(!document.hidden){const before=S.periods.length;ensurePeriods();if(S.periods.length!==before)view=curIdx();render()}});
render();
if("serviceWorker" in navigator&&location.protocol.startsWith("http")){navigator.serviceWorker.register("sw.js").catch(()=>{})}
</script>
