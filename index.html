<head>

<title>Әмиян</title>
<style>
:root{
  --bg:#f2f3f7; --card:#ffffff; --card2:#f7f8fb; --text:#0f172a; --muted:#6b7280; --line:#e6e8ef;
  --brand:#1f3864; --brand2:#3a2a8c; --accent:#ffd666; --tabon:#1f3864; --tabon-d:#8fb1ff; --glow:rgba(31,56,100,.35);
  --green:#16a34a; --green-bg:#e8f6ee; --red:#dc2626; --red-bg:#fdecec; --orange:#d97706; --orange-bg:#fff4e0; --blue:#2563eb; --blue-bg:#e8f0fe;
  --shadow:0 1px 2px rgba(15,23,42,.06),0 4px 16px rgba(15,23,42,.06);
  --radius:18px;
  --tabh:64px;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#0b0f1a; --card:#151b2b; --card2:#1b2234; --text:#eef1f7; --muted:#94a3b8; --line:#253047;
    --green-bg:#11291c; --red-bg:#2d1416; --orange-bg:#2c2110; --blue-bg:#14223f; --shadow:none; }
}
/* Түс палитралары */
:root[data-theme="green"]{--brand:#065f46;--brand2:#0f766e;--accent:#fde68a;--tabon:#047857;--tabon-d:#6ee7b7;--glow:rgba(6,95,70,.35)}
:root[data-theme="sunset"]{--brand:#9a3412;--brand2:#be185d;--accent:#fef08a;--tabon:#c2410c;--tabon-d:#fdba74;--glow:rgba(190,24,93,.30)}
:root[data-theme="graphite"]{--brand:#111827;--brand2:#374151;--accent:#fbbf24;--tabon:#111827;--tabon-d:#fbbf24;--glow:rgba(17,24,39,.35)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Arial,sans-serif;font-size:16px;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
body{min-height:100vh}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,select,textarea{font:inherit;color:var(--text)}
.app{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 8px) 16px calc(var(--tabh) + env(safe-area-inset-bottom) + 90px)}
/* header */
.top{display:flex;align-items:center;justify-content:space-between;padding:6px 2px 4px}
.top h1{font-size:30px;font-weight:800;letter-spacing:-.6px;margin:0}
.iconbtn{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--card);box-shadow:var(--shadow)}
.iconbtn svg{width:20px;height:20px}
.period{display:flex;align-items:center;justify-content:space-between;background:var(--card);border-radius:14px;padding:6px;margin:8px 0 14px;box-shadow:var(--shadow)}
.period button{width:36px;height:36px;border-radius:10px;font-size:20px;color:var(--muted)}
.period button:active{background:var(--card2)}
.period .pname{text-align:center}
.period .pname b{display:block;font-size:16px}
.period .pname small{color:var(--muted);font-size:12px}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--blue-bg);color:var(--blue);margin-left:6px;vertical-align:middle}
/* hero */
.hero{border-radius:24px;padding:20px;color:#fff;background:linear-gradient(135deg,var(--brand) 0%,var(--brand2) 100%);box-shadow:0 10px 30px var(--glow);position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;right:-40px;top:-40px;width:160px;height:160px;border-radius:50%;background:rgba(255,255,255,.07)}
.hero .lbl{font-size:13px;opacity:.8;font-weight:600}
.hero .big{font-size:38px;font-weight:800;letter-spacing:-1px;margin:4px 0 2px}
.hero .sub{font-size:13px;opacity:.85}
.hero .bar{height:8px;background:rgba(255,255,255,.18);border-radius:99px;margin-top:14px;overflow:hidden}
.hero .bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.hero .barlbl{display:flex;justify-content:space-between;font-size:12px;opacity:.8;margin-top:6px}
.hero.hneg{background:linear-gradient(135deg,#7f1d1d 0%,var(--brand2) 100%)}
/* grid tiles */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.tile{background:var(--card);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow);min-width:0}
.tile .t{font-size:12px;color:var(--muted);font-weight:600;margin-bottom:6px}
.tile .v{font-size:19px;font-weight:800;letter-spacing:-.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .s{font-size:12px;color:var(--muted);margin-top:3px}
.tile.wide{grid-column:1/-1}
.pos{color:var(--green)} .neg{color:var(--red)} .warn{color:var(--orange)}
/* cards / lists */
.sec{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin:22px 4px 8px;display:flex;justify-content:space-between;align-items:center}
.sec a,.sec button{text-transform:none;letter-spacing:0;color:var(--blue);font-weight:600;font-size:14px}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line);min-height:56px}
.row:last-child{border-bottom:0}
.row:active{background:var(--card2)}
.row .ic{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;font-weight:800;font-size:14px;flex:none;color:#fff}
.row .mid{flex:1;min-width:0}
.row .mid b{display:block;font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .mid small{color:var(--muted);font-size:12px}
.row .amt{font-weight:700;white-space:nowrap;text-align:right}
.row .amt small{display:block;font-weight:500;color:var(--muted);font-size:11px}
.kv{display:flex;justify-content:space-between;align-items:center;padding:13px 14px;border-bottom:1px solid var(--line)}
.kv:last-child{border-bottom:0}
.kv span{color:var(--muted);font-size:14px}
.kv b{font-weight:700;white-space:nowrap;margin-left:10px}
.chk{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;flex:none;transition:.15s}
.chk.on{background:var(--green);border-color:var(--green)}
.chk.on:after{content:"";width:7px;height:12px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.done b{text-decoration:line-through;color:var(--muted)}
.chip{display:inline-block;font-size:11px;font-weight:700;padding:3px 8px;border-radius:99px}
.chip.r{background:var(--red-bg);color:var(--red)} .chip.g{background:var(--green-bg);color:var(--green)} .chip.o{background:var(--orange-bg);color:var(--orange)} .chip.b{background:var(--blue-bg);color:var(--blue)}
.empty{padding:26px 16px;text-align:center;color:var(--muted);font-size:14px}
.alert{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:14px;margin-top:10px;font-size:14px;line-height:1.35}
.alert.r{background:var(--red-bg);color:var(--red)} .alert.o{background:var(--orange-bg);color:var(--orange)} .alert.b{background:var(--blue-bg);color:var(--blue)}
.alert b{font-weight:700}
.catbar{padding:12px 14px;border-bottom:1px solid var(--line)}
.catbar:last-child{border-bottom:0}
.catbar .h{display:flex;justify-content:space-between;font-size:14px;margin-bottom:6px}
.catbar .h span{color:var(--muted)}
.catbar .b{height:7px;background:var(--card2);border-radius:99px;overflow:hidden}
.catbar .b i{display:block;height:100%;border-radius:99px}
.seg{display:flex;background:var(--card2);border-radius:12px;padding:3px;margin-bottom:12px}
.seg button{flex:1;padding:8px;border-radius:9px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--text);box-shadow:var(--shadow)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;padding:7px 12px;border-radius:99px;background:var(--card);box-shadow:var(--shadow);font-size:13px;font-weight:600;color:var(--muted)}
.chips button.on{background:var(--brand);color:#fff}
.theme{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:12px}
.theme button{background:var(--card);border-radius:16px;padding:10px 4px 8px;box-shadow:var(--shadow);font-size:12px;font-weight:600;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:6px}
.theme button i{width:40px;height:40px;border-radius:50%;display:block;position:relative}
.theme button i b{position:absolute;right:-2px;bottom:-2px;width:16px;height:16px;border-radius:50%;border:2px solid var(--card)}
.theme button.on{outline:2.5px solid var(--tabon);color:var(--text)}
.btn{display:block;width:100%;padding:14px;border-radius:14px;font-weight:700;text-align:center;background:var(--brand);color:#fff;margin-top:10px}
.btn.ghost{background:var(--card);color:var(--blue);box-shadow:var(--shadow)}
.btn.danger{background:var(--red-bg);color:var(--red)}
.btn:active{opacity:.8}
/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb,var(--card) 82%,transparent);backdrop-filter:saturate(180%) blur(18px);-webkit-backdrop-filter:saturate(180%) blur(18px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabs .in{max-width:560px;margin:0 auto;display:flex;height:var(--tabh)}
.tabs button{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:9.5px;letter-spacing:-.2px;font-weight:600;color:var(--muted)}
.tabs button svg{width:23px;height:23px}
.tabs button.on{color:var(--tabon)}
@media (prefers-color-scheme: dark){.tabs button.on{color:var(--tabon-d)}}
.fab{position:fixed;right:20px;bottom:calc(var(--tabh) + env(safe-area-inset-bottom) + 16px);z-index:21;width:58px;height:58px;border-radius:50%;background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;font-size:32px;font-weight:300;display:grid;place-items:center;box-shadow:0 8px 24px rgba(31,56,100,.45)}
.fab:active{transform:scale(.94)}
/* sheet */
.mask{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:40;opacity:0;pointer-events:none;transition:.2s}
.mask.on{opacity:1;pointer-events:auto}
.sheet{visibility:hidden;position:fixed;left:0;right:0;bottom:0;z-index:41;max-width:560px;margin:0 auto;background:var(--bg);border-radius:22px 22px 0 0;transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.8,.2,1);max-height:92vh;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom)}
.sheet.on{transform:none;visibility:visible}
.sheet .grab{width:38px;height:5px;border-radius:9px;background:var(--line);margin:8px auto 2px}
.sheet .sh{display:flex;justify-content:space-between;align-items:center;padding:6px 16px 10px}
.sheet .sh b{font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 8px}
.sheet .sh button{color:var(--blue);font-weight:600}
.sheet .sb{overflow:auto;padding:0 16px 18px}
.field{background:var(--card);border-radius:14px;margin-bottom:10px;padding:10px 14px;box-shadow:var(--shadow)}
.field label{display:block;font-size:12px;color:var(--muted);font-weight:600;margin-bottom:4px}
.field input,.field select,.field textarea{width:100%;border:0;outline:0;background:transparent;font-size:17px;padding:2px 0}
.field input.bigin{font-size:34px;font-weight:800;letter-spacing:-.5px}
.field .row2{display:flex;gap:10px}
.toggle{display:flex;justify-content:space-between;align-items:center}
.toggle input{width:auto;transform:scale(1.3)}
.catpick{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 10px}
.catpick button{padding:8px 12px;border-radius:99px;background:var(--card);box-shadow:var(--shadow);font-size:14px;font-weight:600}
.catpick button.on{background:var(--brand);color:#fff}
.note{font-size:12px;color:var(--muted);line-height:1.45;margin:6px 4px 10px}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 12px);transform:translate(-50%,-150%);background:#111827;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;font-weight:600;z-index:60;transition:.25s;box-shadow:0 8px 20px rgba(0,0,0,.25)}
.toast.on{transform:translate(-50%,0)}
.mgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:12px}
.mgrid button{padding:9px 4px;border-radius:10px;background:var(--card2);font-size:12px;font-weight:700}
.mgrid button.ok{background:var(--green-bg);color:var(--green)}
.mgrid button.due{background:var(--red-bg);color:var(--red)}
.mgrid button.cur{outline:2px solid var(--brand)}
.hidden{display:none!important}
.score{display:flex;align-items:center;gap:16px}
.ring{width:96px;height:96px;border-radius:50%;display:grid;place-items:center;flex:none}
.ring>div{width:76px;height:76px;border-radius:50%;background:var(--card);display:grid;place-items:center;text-align:center}
.ring b{font-size:28px;font-weight:800;line-height:1}.ring small{font-size:11px;color:var(--muted)}
.find{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px;margin-bottom:10px;border-left:5px solid var(--line)}
.find.r{border-left-color:var(--red)}.find.o{border-left-color:var(--orange)}.find.g{border-left-color:var(--green)}.find.b{border-left-color:var(--blue)}
.find h4{margin:0 0 4px;font-size:16px;line-height:1.3}.find .num{font-size:22px;font-weight:800;margin:2px 0 6px}
.find p{margin:0 0 8px;font-size:14px;line-height:1.45;color:var(--muted)}.find p:last-child{margin-bottom:0}
.find .act{font-size:14px;line-height:1.45;color:var(--text);background:var(--card2);border-radius:10px;padding:8px 10px}
.find .act b{color:var(--text)}
.meter{height:8px;background:var(--card2);border-radius:99px;overflow:hidden;margin:6px 0 8px}.meter i{display:block;height:100%;border-radius:99px}
[onclick]{cursor:pointer;-webkit-user-select:none;user-select:none}
.tile[onclick],.kv[onclick],.alert[onclick],.hero[onclick],.catbar[onclick]{transition:transform .12s,opacity .12s}
.tile[onclick]:active,.alert[onclick]:active,.hero[onclick]:active{transform:scale(.97);opacity:.85}
.kv[onclick]:active,.catbar[onclick]:active{background:var(--card2)}
.tile{position:relative}
.tile[onclick]:after{content:"›";position:absolute;right:12px;top:10px;font-size:20px;color:var(--muted);opacity:.6}
.kv[onclick] b:after,.catbar[onclick] .h span:after{content:" ›";color:var(--muted);font-weight:400}
.alert[onclick]>div{flex:1}.alert[onclick]:after{content:"›";font-size:20px;opacity:.6}
</style>
</head>
<body>
<div class="app" id="app"></div>
<div class="fab" id="fab" onclick="addExpense()">+</div>
<nav class="tabs"><div class="in" id="tabs"></div></nav>
<div class="mask" id="mask" onclick="closeSheet()"></div>
<div class="sheet" id="sheet"><div class="grab"></div><div class="sh"><button onclick="closeSheet()">Жабу</button><b id="shTitle"></b><button id="shSave">Сақтау</button></div><div class="sb" id="shBody"></div></div>
<div class="toast" id="toast"></div>
<input type="file" id="fileIn" accept="application/json,.json" class="hidden">
<script>
"use strict";
const KEY="amiyan.v1";
const MONTHS=["Қаңтар","Ақпан","Наурыз","Сәуір","Мамыр","Маусым","Шілде","Тамыз","Қыркүйек","Қазан","Қараша","Желтоқсан"];
const MSHORT=["Қаң","Ақп","Нау","Сәу","Мам","Мау","Шіл","Там","Қыр","Қаз","Қар","Жел"];
const CATS=[["Тамақ","#16a34a"],["Көлік","#0ea5e9"],["Тұрғын үй","#6366f1"],["Байланыс","#14b8a6"],["Бала","#ec4899"],["Киім","#a855f7"],["Денсаулық","#ef4444"],["Ойын-сауық","#f59e0b"],["Сыйлық","#f97316"],["Несие","#7c3aed"],["Himmet","#15803d"],["Резерв","#64748b"],["Белгісіз","#9ca3af"],["Басқа","#475569"]];
const catColor=c=>{const f=CATS.find(x=>x[0]===c)||(typeof EXP_CATS!=="undefined"&&EXP_CATS.find(x=>x[0]===c));if(f)return f[1];const w=(typeof S!=="undefined"&&S&&S.wallets||[]).find(w=>w.name===c);return w&&w.color||"#475569"};
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=n=>{n=Math.round(+n||0);const s=Math.abs(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g," ");return (n<0?"−":"")+s+" ₸"};
const num=v=>{const x=parseFloat(String(v).replace(/\s/g,"").replace(",","."));return isNaN(x)?0:x};
// dates (local, ISO yyyy-mm-dd)
const pad=n=>String(n).padStart(2,"0");
const iso=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const pd=s=>{const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)};
const todayIso=()=>iso(new Date());
const addDays=(s,n)=>{const d=pd(s);d.setDate(d.getDate()+n);return iso(d)};
const addMonths=(s,n,day)=>{const d=pd(s);const want=day||d.getDate();const t=new Date(d.getFullYear(),d.getMonth()+n,1);const last=new Date(t.getFullYear(),t.getMonth()+1,0).getDate();t.setDate(Math.min(want,last));return iso(t)};
const dmy=s=>{if(!s)return"";const d=pd(s);return pad(d.getDate())+"."+pad(d.getMonth()+1)+"."+d.getFullYear()};
const dShort=s=>{const d=pd(s);return d.getDate()+" "+MSHORT[d.getMonth()]};
const ym=s=>s.slice(0,7);
const ymName=k=>{const [y,m]=k.split("-").map(Number);return MONTHS[m-1]+" "+y};
const daysBetween=(a,b)=>Math.round((pd(b)-pd(a))/86400000);

// ---------- seed (data from your Google Sheet) ----------
function seed(){
  const T=[["Halyk кредит 1","Несие",92000],["Halyk кредит 2","Несие",55000],["Kaspi рассрочка","Несие",53000],["Kaspi Red","Несие",40000],["Пәтер","Тұрғын үй",160000],["Коммуналка","Тұрғын үй",20000],["Тариф (байланыс)","Байланыс",10000],["Балабақша","Бала",60000],["Азық-түлік","Тамақ",30000],["Himmet жарнасы","Himmet",20000],["Такси","Көлік",15000],["Күтпеген шығындар","Резерв",25000]];
  const paid=[1,1,1,1,1,0,0,1,0,1,0,0];
  const template=T.map(t=>({id:uid(),name:t[0],cat:t[1],amount:t[2]}));
  const p0="2026-10-27";
  const members=[["Ilkham aga",50000],["Abeke",20000],["Shyngys aga",15000],["Seilkhan aga",30000],["Hasanbi aga",20000],["Marat aga",10000],["Ali aga",15000],["Nurdaulet aga",15000],["Daniyar",20000],["Iliyas aga",30000],["Nurbibi apay",15000],["Umit apay",15000],["Symbat apay",15000],["Nuray apay",10000]].map(m=>({id:uid(),name:m[0],monthly:m[1]}));
  const pay={};members.forEach((m,i)=>{pay[m.id]={"2026-09":m.monthly};if(i>0)pay[m.id]["2026-10"]=m.monthly});
  const D=(kind,who,amount,date,due,note)=>({id:uid(),kind,who,amount,date,due,returned:false,note});
  return {
    v:1,
    set:{salary:670000,opening:0},
    bank:{base:616000,at:Date.now(),log:[]},
    periods:[{start:p0,salary:670000,other:0}],
    template,
    mand:{[p0]:template.map((t,i)=>({id:uid(),tid:t.id,name:t.name,cat:t.cat,amount:t.amount,paid:!!paid[i]}))},

function lastRealIdx(){for(let i=S.periods.length-1;i>=0;i--)if(!S.periods[i].planned)return i;return 0}
function payDay(){return pd(S.periods[lastRealIdx()].start).getDate()}
function pEnd(i){return i<S.periods.length-1?addDays(S.periods[i+1].start,-1):addDays(addMonths(S.periods[i].start,1,payDay()),-1)}
function rekey(i,ns){const p=S.periods[i];if(p.start===ns)return;if(S.mand[p.start]){S.mand[ns]=S.mand[p.start];delete S.mand[p.start]}p.start=ns;initMand(ns)}
// Жоспар айларының күндері ретпен тұрсын (әрқайсысы алдыңғысынан кейін)
function cascade(from){for(let j=Math.max(1,from);j<S.periods.length;j++){const q=S.periods[j];if(q.planned&&q.start<=S.periods[j-1].start)rekey(j,addMonths(S.periods[j-1].start,1,payDay()))}}
function pName(i){const d=pd(S.periods[i].start);return MONTHS[d.getMonth()]+" "+d.getFullYear()}
function initMand(start){if(!S.mand[start])S.mand[start]=S.template.map(t=>({id:uid(),tid:t.id,name:t.name,cat:t.cat,amount:t.amount,paid:false}))}
function ensurePeriods(){
  // Жалақы тек «Жаңа жалақы түсті» батырмасымен түседі. Күтілген күн өтіп кетсе, келесі ай ертеңге жылжиды.
  let ch=false;const t=todayIso();
  S.periods.forEach(p=>initMand(p.start));
  const fi=S.periods.findIndex(p=>p.planned);
  if(fi>0&&S.periods[fi].start<=t){rekey(fi,addDays(t,1));cascade(fi+1);ch=true}
  if(ch)save();
}
// Алдағы айды жоспарлау үшін ашу (банкке әсер етпейді, күні келгенде жалақы өзі түседі)
const MAX_AHEAD=24;
function addPlannedPeriod(){const last=S.periods[S.periods.length-1];if(S.periods.length-curIdx()>MAX_AHEAD)return false;const st=addMonths(last.start,1,payDay());S.periods.push({start:st,salary:S.set.salary,other:0,planned:true});initMand(st);save();return true}
const isFuture=i=>!!(S.periods[i]&&S.periods[i].planned);
const net=c=>c.income-c.mand-c.other-c.loans; // осы айдың өз нәтижесі (өткен айдың қалдығынсыз)

function calc(i){
  const p=S.periods[i],st=p.start,en=pEnd(i);
  const opening=i===0?num(S.set.opening):calc(i-1).closing;
  const items=S.mand[st]||[];
  const mand=items.reduce((a,x)=>a+num(x.amount),0);
  const mandPaid=items.filter(x=>x.paid).reduce((a,x)=>a+num(x.amount),0);
  const allExps=S.exp.filter(e=>e.date>=st&&e.date<=en);
  const exps=allExps.filter(isOwn);
  const other=exps.reduce((a,e)=>a+num(e.amount),0);
  const given=S.debts.filter(d=>d.kind==="given"&&d.date>=st&&d.date<=en).reduce((a,d)=>a+num(d.amount),0);
  const taken=S.debts.filter(d=>d.kind==="taken"&&d.date>=st&&d.date<=en).reduce((a,d)=>a+num(d.amount),0);
  const income=num(p.salary)+num(p.other);
  const closing=opening+income-mand-other-(given-taken);
  return {st,en,opening,income,mand,mandPaid,unpaid:mand-mandPaid,other,exps,allExps,loans:given-taken,closing};
}

function himFirstUnpaid(){const H=S.himmet;for(const k of monthsFrom(H.start,curYm()))if(H.members.some(m=>num((H.pay[m.id]||{})[k])<num(m.monthly)))return k;return curYm()}
// «Himmet жарнасы» (санаты Himmet) төлемі = менің (S.himmet.me) сол айдағы жарнам. Екеуі бір-бірімен байланысты.
const isMe=mid=>!!S.himmet.me&&S.himmet.me===mid;
function linkedMand(k){const p=S.periods.find(p=>ym(p.start)===k);return p?(S.mand[p.start]||[]).find(x=>x.cat==="Himmet"):null}
function syncMandFromHimmet(k){const me=S.himmet.me;if(!me)return;const it=linkedMand(k);if(!it)return;const want=num((S.himmet.pay[me]||{})[k])>0;
  if(it.paid!==want){it.paid=want;it.pts=Date.now();bankMove(want?-num(it.amount):num(it.amount),(want?"Төленді: ":"Төлем қайтарылды: ")+it.name)}}

  const H=himmet(),St=students(),M=money(),wt=M.notMine,own=M.own;

    ${M.borrow?`<p class="note">${esc(wName("himmet"))} — аманат ақша. Жеке қаржым жетпегендіктен одан ${fmt(M.borrow)} жұмсалды. Жалақы түскенде бұл қарыз өзі жабылып, ${esc(wName("himmet"))} қайта толады.</p>`:""}`;
  } else if(walSeg==="him"){

    <div class="sec">Ай</div><div class="chips">${ms.map(k=>`<button class="${k===himYm?"on":""}" onclick="himYm='${k}';render()">${ymName(k)}</button>`).join("")}</div>

  } else {
    const Gr=G(),St=grpStats(Gr),gw=grpWallet(grpW),T=grpTerm();

    <div class="sec">Адамдар · ${(Gr.people||[]).length} <button onclick="personEdit()">+ Қосу</button></div>
    <div class="card">${(Gr.people||[]).length?Gr.people.map((m,i)=>{const cnt=Gr.acts.filter(a=>(a.who||[]).includes(m.id)).length;return `<div class="row" onclick="personEdit('${m.id}')"><div class="ic" style="background:${gw.color||"#475569"}">${esc((m.name||"?")[0].toUpperCase())}</div><div class="mid"><b>${esc(m.name)}</b><small>${m.note?esc(m.note)+" · ":""}${cnt?cnt+" іс-шараға қатысты":"Іс-шара жоқ"}</small></div><div class="amt" style="color:var(--muted);font-weight:500">${i+1}</div></div>`}).join(""):`<div class="empty">Әлі ешкім жоқ. «+ Қосу» басып, есімдерін жазыңыз.</div>`}</div>
    <div class="sec">Іс-шаралар есебі <button onclick="actEdit()">+ Қосу</button></div>
    <div class="card">${Gr.acts.length?[...Gr.acts].sort((a,b)=>b.date.localeCompare(a.date)).map(a=>`<div class="row" onclick="actEdit('${a.id}')"><div class="ic" style="background:#0e7490">${num(a.n)}</div><div class="mid"><b>${esc(a.name)}</b><small>${dmy(a.date)} · ${num(a.n)} ${T}${num(a.n)?" · біріне "+fmt(num(a.amount)/num(a.n)):""}${(a.who||[]).length?"<br>"+a.who.map(id=>(Gr.people||[]).find(m=>m.id===id)).filter(Boolean).map(m=>esc(m.name)).join(", "):""}</small></div><div class="amt">${fmt(a.amount)}</div></div>`).join(""):'<div class="empty">Әлі іс-шара жоқ</div>'}</div>`;

}

 openSheet(isNew?"Жаңа әмиян":"Әмиянды өзгерту",`${field("Атауы","wName",w.name,"text",isNew?"autofocus":"")}${field(w.type==="himmet"?"Болу керек сома (₸)":"Ішіндегі сома (₸)","wAmt",isNew?"":wAmtRaw(w),"number",isNew?"":"autofocus")}${w.type==="himmet"&&money().borrow?`<p class="note">Қазір бары: ${fmt(wAmt(w))} (менің қарызым ${fmt(money().borrow)} шегерілген).</p>`:""}
 ${calc?`<p class="note">Бұл сома ${w.type==="himmet"?"жарналардан":"түсім мен іс-шаралардан"} өзі есептеледі (${fmt(wBase(w))}). Басқа сома жазсаңыз, айырмасы түзету ретінде сақталады${num(w.adj)?` — қазіргі түзету ${fmt(w.adj)}`:""}.</p>`:""}
 ${isNew?`<div class="field toggle"><label style="margin:0;font-size:15px;color:var(--text)">Оқушылар сияқты<br><small style="color:var(--muted);font-weight:500">Ай сайын белгілі сома түседі, іс-шараларға жұмсалады</small></label><input type="checkbox" id="wGrp"></div>`:""}
 <div class="field toggle"><label style="margin:0;font-size:15px;color:var(--text)">Банкке жаңадан түскен ақша<br><small style="color:var(--muted);font-weight:500">Белгілесеңіз, қосылған сома банк шотына да қосылады (алынса — азаяды). Белгілемесеңіз, бар ақшадан бөлінеді.</small></label><input type="checkbox" id="wBank"></div>
 <div class="field toggle"><label style="margin:0;font-size:15px;color:var(--text)">Менің қаржым емес<br><small style="color:var(--muted);font-weight:500">Аманат ақша: «Менің қаржым емес» сомасына кіреді</small></label><input type="checkbox" id="wNM" ${isNotMine(w)?"checked":""}></div>
 <div class="field"><label>Түсі</label><div class="catpick" id="colpick" style="margin:6px 0 2px">${WCOLORS.map(c=>`<button type="button" class="${c===w.color?"on":""}" style="width:34px;height:34px;padding:0;background:${c};${c===w.color?"outline:3px solid var(--text);outline-offset:2px":""}" onclick="pickColor(this,'${c}')"></button>`).join("")}</div></div>
 ${!isNew&&wSpent(w)?`<div class="sec" style="margin-top:6px">Осы әмияннан шығындар<span>−${fmt(wSpent(w))}</span></div><div class="card" style="margin-bottom:10px">${S.exp.filter(e=>e.src===w.id).sort((a,b)=>b.date.localeCompare(a.date)).map(e=>`<div class="kv"><span>${dmy(e.date)} · ${esc(e.note||e.cat)}</span><b>${fmt(e.amount)}</b></div>`).join("")}</div>`:""}
 ${calc&&num(w.adj)?`<button class="btn ghost" onclick="wReset('${w.id}')">Түзетуді алып тастау</button>`:""}
 ${!isNew?`<div class="field"><label>Тез өзгерту: сома жазып, батырманы басыңыз</label><div class="row2"><input id="wDelta" type="number" inputmode="decimal" placeholder="0" style="flex:1"><button type="button" class="chip g" style="padding:8px 14px;font-size:14px" onclick="wDelta(1)">+ Салу</button><button type="button" class="chip r" style="padding:8px 14px;font-size:14px" onclick="wDelta(-1)">− Алу</button></div></div>`:""}
 ${!isNew?`<button class="btn danger" onclick="wDel('${w.id}')">Әмиянды өшіру</button>`:""}`,()=>{const n=val("wName").trim();if(!n){toast("Атауын жазыңыз");return false}const a=num(val("wAmt"));
  const nm=$("wNM").checked,toBank=$("wBank").checked;if(toBank&&val("wAmt")!==""){const d=a-(isNew?0:wAmtRaw(w));bankMove(d,(d>0?"Әмиянға түсті: ":"Әмияннан алынды: ")+n)}if(isNew){if($("wGrp")&&$("wGrp").checked){const id=uid();S.wallets.push({id,type:"group",name:n,adj:0,color:pickedColor,notMine:nm,g:{flat:true,count:1,per:0,start:curYm(),recv:{},acts:[],opening:a}});walSeg="stu";grpW=id;toast("Әмиян қосылды — айлық сомасын жазыңыз");return}S.wallets.push({id:uid(),type:"manual",name:n,amount:a,color:pickedColor,notMine:nm});toast("Әмиян қосылды");return}

function wRestore(){if(!hasW("himmet"))S.wallets.unshift({id:"him",type:"himmet",name:"Himmet",adj:0,color:"#15803d"});if(!hasW("students"))S.wallets.push({id:"stu",type:"students",name:"Оқушылар ақшасы",adj:0,color:"#0e7490"});closeSheet();save();render();toast("Қайтарылды")}

function himEdit(mid){const m=S.himmet.members.find(x=>x.id===mid);const p=S.himmet.pay[mid]=S.himmet.pay[mid]||{};openSheet(m.name,`${field(ymName(himYm)+" төлегені (₸)","hPay",p[himYm]||"","number","autofocus")}${field("Аты","hName",m.name)}${field("Ай сайынғы жарна (₸)","hMon",m.monthly,"number")}<div class="field toggle"><label style="margin:0;font-size:15px;color:var(--text)">Бұл — мен<br><small style="color:var(--muted);font-weight:500">«Төлемдер»-дегі Himmet жарнасымен байланысады</small></label><input type="checkbox" id="hMe" ${isMe(mid)?"checked":""}></div><button class="btn danger" onclick="himDel('${mid}')">Тізімнен өшіру</button>`,()=>{const v=num(val("hPay"));bankMove(v-num(p[himYm]),wName("himmet")+": "+m.name);if(v>0)p[himYm]=v;else delete p[himYm];m.name=val("hName").trim()||m.name;m.monthly=num(val("hMon"));if($("hMe").checked)S.himmet.me=mid;else if(isMe(mid))S.himmet.me=null;if(isMe(mid))syncMandFromHimmet(himYm)})}

function stuSettings(){const g=G(),T=grpTerm(),Tc=T==="оқушы"?"Оқушы":"Адам";openSheet(grpName(),(g.flat?`<input type="hidden" id="sCnt" value="1">`+field("Айына түсетін сома (₸)","sPer",g.per,"number","class='bigin' autofocus"):field(Tc+" саны","sCnt",g.count,"number","autofocus")+field("Бір "+T+"ға (₸, айына)","sPer",g.per,"number"))+field("Қай айдан бастап","sStart",g.start,"month")+`<p class="note">Өзгеріс әлі түспеген айларға қолданылады.</p>`,()=>{g.count=num(val("sCnt"));g.per=num(val("sPer"));if(val("sStart"))g.start=val("sStart")})}
function actEdit(id){const g=G(),T=grpTerm(),a=id?g.acts.find(x=>x.id===id):{name:"",date:todayIso(),n:"",amount:"",note:""};openSheet(id?"Іс-шара":"Жаңа іс-шара",`${field("Іс-шара атауы","aName",a.name,"text",id?"":"autofocus")}<div class="field"><div class="row2"><div style="flex:1"><label>Күні</label><input id="aDate" type="date" value="${a.date}"></div><div style="flex:1"><label>Қатысқан ${T}</label><input id="aN" type="number" inputmode="numeric" value="${esc(a.n)}"></div></div></div>
 ${(g.people||[]).length?`<div class="field"><label>Кімдер қатысты? <span style="font-weight:500">(басып белгілеңіз)</span></label><div class="catpick" id="whoPick" style="margin:6px 0">${g.people.map(m=>`<button type="button" data-id="${m.id}" class="${(a.who||[]).includes(m.id)?"on":""}" onclick="this.classList.toggle('on');$('aN').value=document.querySelectorAll('#whoPick .on').length">${esc(m.name)}</button>`).join("")}<button type="button" onclick="const all=[...document.querySelectorAll('#whoPick button[data-id]')],on=all.every(b=>b.classList.contains('on'));all.forEach(b=>b.classList.toggle('on',!on));$('aN').value=document.querySelectorAll('#whoPick .on').length" style="background:none;box-shadow:none;color:var(--blue)">Бәрі</button></div></div>`:""}${field("Жұмсалған сома (₸)","aAmt",a.amount,"number")}${field("Ескерту","aNote",a.note)}${id?`<button class="btn danger" onclick="actDel('${id}')">Өшіру</button>`:""}`,()=>{const n=val("aName").trim();if(!n){toast("Атауын жазыңыз");return false}const who=[...document.querySelectorAll('#whoPick button.on[data-id]')].map(b=>b.dataset.id);const o={name:n,date:val("aDate")||todayIso(),n:num(val("aN")),who,amount:num(val("aAmt")),note:val("aNote")};if(id){if(isNewRec(a))bankMove(-(o.amount-num(a.amount)),"Іс-шара түзетілді: "+n);Object.assign(a,o)}else{bankMove(-o.amount,grpName()+" · іс-шара: "+n);g.acts.push({id:uid(),ts:Date.now(),...o})}})}
function personEdit(id){const g=G();g.people=g.people||[];const m=id?g.people.find(x=>x.id===id):{name:"",note:""};
 openSheet(id?"Адам":"Жаңа адам",`${field("Есімі","pName",m.name,"text","autofocus")}${field("Ескерту (міндетті емес)","pNote",m.note||"","text",'placeholder="мысалы: телефоны, сыныбы"')}${id?`<button class="btn danger" onclick="personDel('${id}')">Тізімнен өшіру</button>`:`<p class="note">Бірнеше адамды бірден қосу үшін есімдерін үтірмен жазыңыз: Асқар, Дана, Ерлан</p>`}`,()=>{const nm=val("pName").trim();if(!nm){toast("Есімін жазыңыз");return false}
  if(id){m.name=nm;m.note=val("pNote").trim();return}
  const names=nm.split(",").map(x=>x.trim()).filter(Boolean);names.forEach(x=>g.people.push({id:uid(),name:x,note:names.length===1?val("pNote").trim():""}));toast(names.length>1?names.length+" адам қосылды":"Қосылды")})}
function personDel(id){if(!confirm("Тізімнен өшіру керек пе? (Іс-шаралар тарихы сақталады)"))return;const g=G();g.people=g.people.filter(x=>x.id!==id);closeSheet();save();render()}
function actDel(id){if(!confirm("Өшіру керек пе?"))return;const g=G();{const a=g.acts.find(x=>x.id===id);if(isNewRec(a))bankMove(num(a.amount),"Іс-шара өшірілді: "+a.name)}g.acts=g.acts.filter(x=>x.id!==id);closeSheet();save();render()}

let debtSeg="taken"; // «Мен алдым» бірінші ашылады
function vDebt(){
  const M=money();
  const list=S.debts.filter(d=>d.kind===debtSeg).sort((a,b)=>(a.returned-b.returned)||((a.due||"9")).localeCompare(b.due||"9"));
  const open=list.filter(d=>!d.returned).reduce((a,d)=>a+num(d.amount),0)+(debtSeg==="taken"?M.borrow:0);
  return header("Қарыздар")+`<div class="seg"><button class="${debtSeg==="taken"?"on":""}" onclick="debtSeg='taken';render()">Мен алдым</button><button class="${debtSeg==="given"?"on":""}" onclick="debtSeg='given';render()">Мен бердім</button></div>
  <div class="grid" style="margin-top:0"><div class="tile"><div class="t">${debtSeg==="given"?"Маған қайтарылады":"Мен қайтарамын"}</div><div class="v ${debtSeg==="given"?"pos":"neg"}">${fmt(open)}</div></div><div class="tile"><div class="t">${esc(wName("himmet"))}-ке қарыз</div><div class="v ${M.borrow?"neg":"pos"}">${fmt(M.borrow)}</div><div class="s">автоматты</div></div></div>
  <div class="sec">Тізім <button onclick="debtEdit()">+ Қосу</button></div>
  <div class="card">${debtSeg==="taken"&&M.borrow?`<div class="row" onclick="explainBorrow()"><div class="ic" style="background:#15803d">H</div><div class="mid"><b>${esc(wName("himmet"))}</b><small>Жеке қаржым жетпегендіктен алынды · автоматты</small></div><div class="amt">${fmt(M.borrow)}<small><span class="chip o">Жалақыдан қайтады</span></small></div></div>`:""}${list.length||(debtSeg==="taken"&&M.borrow)?list.map(d=>`<div class="row ${d.returned?"done":""}"><div class="chk ${d.returned?"on":""}" onclick="debtToggle('${d.id}')"></div><div class="mid" onclick="debtEdit('${d.id}')"><b>${esc(d.who)}</b><small>${dmy(d.date)}${d.due?" → "+dmy(d.due):""}${d.note?" · "+esc(d.note):""}</small></div><div class="amt" onclick="debtEdit('${d.id}')">${fmt(d.amount)}<small>${statusChip(d)}</small></div></div>`).join(""):'<div class="empty">Тізім бос</div>'}</div>
  <p class="note">Дөңгелекті бассаңыз — «қайтарылды» болады. Жаңа берген/алған қарыз сол кезеңнің қалдығына әсер етеді.</p>`;
}
const dSign=d=>d.kind==="given"?-1:1; // қарыз берсем банк азаяды, алсам көбейеді
function explainBorrow(){const M=money();openSheet(wName("himmet")+"-ке қарыз",`<div class="card">
 <div class="kv" onclick="closeSheet();editBank()"><span>Банк шотында</span><b>${fmt(bankNow())}</b></div>
 <div class="kv"><span>− Менің қаржым емес (болу керек)</span><b class="neg">${fmt(-M.raw)}</b></div>
 <div class="kv"><span><b style="color:var(--text)">= Жетпей тұрған өз ақшам</b></span><b class="neg">${fmt(-M.borrow)}</b></div></div>
 <p class="note">Жеке қаржым таусылғаннан кейінгі әр шығын ${esc(wName("himmet"))} ақшасынан жұмсалады да, осы қарыз көбейеді. Жалақы не басқа кіріс түскенде қарыз өзі азайып, ${esc(wName("himmet"))} қайта толады. Қолмен ештеңе жазудың қажеті жоқ.</p>
 <div class="card"><div class="kv"><span>${esc(wName("himmet"))}: болу керек</span><b>${fmt(M.himShould)}</b></div><div class="kv"><span>${esc(wName("himmet"))}: қазір бар</span><b class="warn">${fmt(M.himShould-M.borrow)}</b></div></div>`)}
function debtToggle(id){const d=S.debts.find(x=>x.id===id);d.returned=!d.returned;bankMove((d.returned?-1:1)*dSign(d)*num(d.amount),(d.returned?"Қарыз қайтарылды: ":"Қарыз қайта ашылды: ")+d.who);save();render();toast(d.returned?"Қайтарылды деп белгіленді":"Қайтадан ашық")}
function debtEdit(id){const d=id?S.debts.find(x=>x.id===id):{kind:debtSeg,who:"",amount:"",date:todayIso(),due:"",note:""};openSheet(id?"Қарыз":(debtSeg==="given"?"Қарыз бердім":"Қарыз алдым"),`${field(d.kind==="given"?"Кімге":"Кімнен","dWho",d.who,"text",id?"":"autofocus")}${field("Сома (₸)","dAmt",d.amount,"number")}<div class="field"><div class="row2"><div style="flex:1"><label>${d.kind==="given"?"Берген күні":"Алған күні"}</label><input id="dDate" type="date" value="${d.date}"></div><div style="flex:1"><label>Қайтару мерзімі</label><input id="dDue" type="date" value="${d.due||""}"></div></div></div>${field("Ескерту","dNote",d.note)}${id?`<button class="btn danger" onclick="debtDel('${id}')">Өшіру</button>`:""}`,()=>{const w=val("dWho").trim();if(!w){toast("Атын жазыңыз");return false}const o={who:w,amount:num(val("dAmt")),date:val("dDate")||todayIso(),due:val("dDue"),note:val("dNote")};if(id){if(isNewRec(d)&&!d.returned)bankMove(dSign(d)*(o.amount-num(d.amount)),"Қарыз түзетілді: "+w);Object.assign(d,o)}else{const nd={id:uid(),ts:Date.now(),kind:d.kind,returned:false,...o};bankMove(dSign(nd)*nd.amount,(nd.kind==="given"?"Қарыз бердім: ":"Қарыз алдым: ")+w);S.debts.push(nd)}})}
function debtDel(id){if(!confirm("Өшіру керек пе?"))return;{const d=S.debts.find(x=>x.id===id);if(isNewRec(d)&&!d.returned)bankMove(-dSign(d)*num(d.amount),"Қарыз өшірілді: "+d.who)}S.debts=S.debts.filter(x=>x.id!==id);closeSheet();save();render()}

// ---------- АНАЛИЗ: деректерге негізделген қатал талдау ----------
function vAnal(){
  const c=calc(view),p=S.periods[view],inc=c.income||1,items=S.mand[p.start]||[],M=money(),H=himmet();
  const sumCat=k=>items.filter(x=>x.cat===k).reduce((a,x)=>a+num(x.amount),0);
  const pct=x=>Math.round(x*100);
  const credit=sumCat("Несие"),housing=sumCat("Тұрғын үй"),n=net(c),out=c.mand+c.other+c.loans;
  const unknown=c.exps.filter(e=>e.cat==="Белгісіз").reduce((a,e)=>a+num(e.amount),0);
  const t=todayIso(),isCur=view===curIdx(),days=daysBetween(c.st,c.en)+1,passed=isCur?Math.max(1,Math.min(days,daysBetween(c.st,t)+1)):days,left=Math.max(1,days-passed+ (isCur?1:0));
  const recOpen=S.debts.filter(d=>d.kind==="given"&&!d.returned),recDue=recOpen.filter(d=>d.due&&daysBetween(t,d.due)<=7);
  const payOpen=S.debts.filter(d=>d.kind==="taken"&&!d.returned);
  const tplTotal=S.template.reduce((a,x)=>a+num(x.amount),0);
  // минустан шығу болжамы: бар айлар бойынша, одан әрі — жалақы − ай сайынғы төлемдер үлгісі
  let bal=c.closing,ahead=null;const perMonth=num(S.set.salary)-tplTotal;
  if(bal<0){for(let k=1;k<=36;k++){const i=view+k;bal=i<S.periods.length?calc(i).closing:bal+perMonth;if(bal>=0){ahead=k;break}}}
  const aheadName=k=>{const d=pd(addMonths(c.st,k,payDay()));return MONTHS[d.getMonth()]+" "+d.getFullYear()};
  const F=[];let score=100;
  const add=(lvl,title,num,text,act,meter)=>F.push({lvl,title,num,text,act,meter});
  // 1. Ай нәтижесі
  if(n<0){score-=20;add("r","Табысыңыздан көп жұмсап жатырсыз",fmt(n),`Кіріс ${fmt(c.income)}, ал шығыс ${fmt(out)}. Айырма табысыңыздың <b>${pct(-n/inc)}%</b>-ы. Бұл қарқынмен әр ай қарызға батасыз.`,`Ай сайынғы тізімнен кемінде <b>${fmt(-n)}</b> қысқартпасаңыз, бұл ай минуспен жабылады. Жаңа шығын алдында сұраңыз: «Бұсыз өмір сүре аламын ба?»`)}
  else if(n/inc<0.1){score-=10;add("o","Жинақ тым аз",fmt(n),`Ай соңында табыстың тек ${pct(n/inc)}%-ы қалады. Қаржылық тұрақтылық үшін кемінде 10–20% керек.`,`Әр жалақыдан бірінші <b>${fmt(Math.round(inc*0.1/1000)*1000)}</b> бөлек әмиянға салыңыз — қалғанымен өмір сүріңіз.`)}
  else add("g","Ай плюспен жабылады",`+${fmt(n)}`,`Табыстың ${pct(n/inc)}%-ы қалады. Жақсы — енді оны жұмсап қоймаңыз.`,`Қалған соманы ай басында қорға не қарыз жабуға бағыттаңыз.`);
  // 2. Аманат ақша
  if(M.borrow>0){score-=20;const mo=perMonth>0?Math.ceil(M.borrow/perMonth):null;add("r",`${wName("himmet")} ақшасын жұмсап отырсыз`,fmt(M.borrow),`Бұл сіздің ақшаңыз емес — ${H.count} адамның аманаты. Жеке қаржыңыз 0, яғни әр жаңа шығын тікелей аманаттан кетеді.${mo?` Қазіргі қарқынмен қайтаруға шамамен <b>${mo} ай</b> керек.`:""}`,`Келесі жалақыдан <b>бірінші осыны</b> толтырыңыз. Толтырмайынша бірде-бір қажетсіз шығын жасамаңыз.`)}
  // 3. Ай сайынғы төлемдер үлесі
  const ms=c.mand/inc;if(ms>0.8)score-=12;else if(ms>0.6)score-=6;
  add(ms>0.8?"r":ms>0.6?"o":"g","Ай басында-ақ табыстың қаншасы кетеді",`${pct(ms)}%`,`Ай сайынғы төлемдер ${fmt(c.mand)}. Сізде қалатын еркін ақша — <b>${fmt(c.income-c.mand)}</b>, яғни күніне ~${fmt((c.income-c.mand)/days)}.${ms>0.8?" Бұл өте тар: кішкене күтпеген шығын бәрін бұзады.":""}`,ms>0.6?`Тізімді қараңыз: Такси (${fmt(sumCat("Көлік"))}), «Күтпеген» (${fmt(sumCat("Резерв"))}) — нақты керек пе? Әр 10 000 ₸ қысқарту жылына 120 000 ₸.`:"",{v:ms,c:ms>0.8?"var(--red)":ms>0.6?"var(--orange)":"var(--green)"})
  // 4. Несие
  if(credit){const cs=credit/inc;if(cs>0.3)score-=12;else if(cs>0.2)score-=6;const cr=items.filter(x=>x.cat==="Несие").sort((a,b)=>num(a.amount)-num(b.amount));
   add(cs>0.3?"r":cs>0.2?"o":"g","Несиелер табысыңызды жеп жатыр",`${fmt(credit)} · ${pct(cs)}%`,`${cr.length} несие/рассрочка. Қауіпсіз шек — табыстың 20%, қауіпті шек — 30%. Сіз ${cs>0.3?"<b>қауіпті шектен асып кеттіңіз</b>":cs>0.2?"шектің үстіндесіз":"шекте"}.`,`<b>Жаңа несие, рассрочка, Kaspi Red — мүлдем алмаңыз.</b> Ең кішісінен бастап жабыңыз: ${cr.map(x=>esc(x.name)+" "+fmt(x.amount)).join(", ")}. Біреуі жабылса, ай сайын сонша босайды.`,{v:cs/0.5,c:cs>0.3?"var(--red)":cs>0.2?"var(--orange)":"var(--green)"})}
  // 5. Тұрғын үй
  if(housing){const hs=housing/inc;if(hs>0.3)score-=5;add(hs>0.3?"o":"g","Тұрғын үй шығыны",`${fmt(housing)} · ${pct(hs)}%`,`Норма — табыстың 25–30%-ы.${hs>0.3?" Сіз нормадан жоғарысыз.":" Нормада."}`,"")}
  // 6. Белгісіз шығын
  if(c.other>0){const us=unknown/c.other;if(us>0.5){score-=8;add("r","Ақшаңыз қайда кеткенін білмейсіз",fmt(unknown),`Басқа шығындардың <b>${pct(us)}%</b>-ы «Белгісіз». Бақыланбаған ақша — ең көп ағатын ақша.`,`Әр шығынды <b>сол сәтте</b> «+» арқылы жазыңыз: 10 секунд. Бір апта жазсаңыз, ақша қайда кететіні анық көрінеді.`)}
   else if(isCur){const perDay=c.other/passed,proj=perDay*days;add(proj>c.income-c.mand?"o":"b","Күнделікті шығын қарқыны",`${fmt(perDay)} / күн`,`${passed} күнде ${fmt(c.other)} жұмсалды. Осы қарқынмен ай соңына дейін ~<b>${fmt(proj)}</b> болады.`,"")}}
  // 7. Ақшасыз қарыз беру
  if(c.loans>0&&(M.own<=0||M.borrow>0)){score-=8;add("r","Өзіңізде жоқ ақшаны қарызға бердіңіз",fmt(c.loans),`Бұл айда ${fmt(c.loans)} қарыз бердіңіз, ал жеке қаржыңыз жетпейді. Іс жүзінде бұл ақша ${esc(wName("himmet"))} аманатынан берілді.`,`Ақша жетпей тұрғанда <b>ешкімге қарыз бермеңіз</b> — туыс болса да. «Қазір мүмкіндігім жоқ» деу — қалыпты.`)}
  // 8. Сізге қарыздар
  if(recOpen.length){const sum=recOpen.reduce((a,d)=>a+num(d.amount),0);if(recDue.length)score-=4;
   add(recDue.length?"o":"b","Сізге қарызы барлар",fmt(sum),`${recOpen.length} адам. ${recDue.length?`Мерзімі өткен не жақын: <b>${recDue.map(d=>esc(d.who)+" "+fmt(d.amount)).join(", ")}</b>.`:""}${M.borrow?` Бұл ақша қайтса, ${esc(wName("himmet"))} қарызының ${pct(Math.min(1,sum/M.borrow))}%-ы жабылады.`:""}`,recDue.length?`<b>Бүгін</b> хабарласыңыз. Нақты күн сұраңыз: «Қашан қайтарасыз?» емес, «31-інде қайтарасыз ба?»`:"")}
  // 9. Сіздің қарыздарыңыз
  if(payOpen.length){const sum=payOpen.reduce((a,d)=>a+num(d.amount),0),old=payOpen.filter(d=>daysBetween(d.date,t)>365);
   add(old.length?"o":"b","Сіздің қарыздарыңыз",fmt(sum),`${payOpen.map(d=>esc(d.who)+" "+fmt(d.amount)+(d.due?" ("+dmy(d.due)+" дейін)":"")).join(", ")}.${old.length?` Кейбірі <b>бір жылдан асты</b> — ұмытылған қарыз қарым-қатынасты бұзады.`:""}`,old.length?"Мерзімі келмей тұрып жоспарлаңыз: ай сайын аз-аздан бөліп қойыңыз.":"")}
  // 10. Қор
  if(M.own<c.mand){score-=8;add("r","Қорыңыз жоқ",fmt(Math.max(0,M.own)),`Жұмыстан қалсаңыз не ауырсаңыз, ${M.own<=0?"<b>бір күн де</b>":"тек "+Math.round(M.own/(c.mand/30))+" күн"} шыдайсыз. Минимум — 1 айлық төлем (${fmt(c.mand)}), норма — 3 ай.`,`Himmet қарызы жабылған соң, ай сайын тұрақты сома қорға салыңыз — қолданбайтын бөлек әмиян ашыңыз.`)}
  // 11. Болжам
  if(c.closing<0){if(ahead)add("o","Минустан қашан шығасыз",aheadName(ahead),`Қазіргі жоспармен ай соңындағы қалдық <b>${ahead} айдан кейін</b> ғана плюсқа шығады. Бұл — күнделікті ұсақ шығындарсыз есеп; шын мәнінде ұзағырақ.`,`«Төлемдер» бетінде алдағы айлардың шығынын азайтып көріңіз — болжам бірден өзгереді.`);
   else{score-=10;add("r","Минустан шыға алмайсыз",`36 ай+`,`Қазіргі кіріс пен ай сайынғы төлемдермен қалдық 3 жылда да плюсқа шықпайды.`,`Не кірісті көбейту, не ай сайынғы төлемдерді азайту керек — басқа жол жоқ.`)}}
  // 12. Himmet жиналымы
  if(H.owed>0&&hasW("himmet")){const who=S.himmet.members.filter(m=>monthsFrom(S.himmet.start,curYm()).some(k=>num((S.himmet.pay[m.id]||{})[k])<num(m.monthly)));
   add("b",`${wName("himmet")}: жиналмаған жарна`,fmt(H.owed),`Төлемегендер: ${who.map(m=>esc(m.name)).join(", ")}.`,`Аманатқа жауаптысыз — жұмсақ түрде еске салыңыз.`)}
  score=Math.max(0,Math.min(100,score));
  const verdict=score<40?["Қауіпті","var(--red)","Қаржыңыз бақылаудан шығып барады. Төмендегі қызыл пункттерді бірінші түзетіңіз."]:score<60?["Нашар","var(--orange)","Тұрақсыз жағдай. Бір күтпеген шығын — дағдарыс."]:score<80?["Орташа","var(--blue)","Негізі бар, бірақ қор мен жинақ әлсіз."]:["Жақсы","var(--green)","Тәртіп бар. Енді жинақты көбейтіңіз."];
  const order={r:0,o:1,b:2,g:3};F.sort((a,b)=>order[a.lvl]-order[b.lvl]);
  const top=F.filter(f=>f.act&&f.lvl!=="g").slice(0,3);
  return header("Анализ")+periodBar()+`
  <div class="tile wide"><div class="score"><div class="ring" style="background:conic-gradient(${verdict[1]} ${score*3.6}deg,var(--card2) 0)"><div><div><b style="color:${verdict[1]}">${score}</b><br><small>/ 100</small></div></div></div>
   <div><div class="t" style="margin-bottom:2px">Қаржы денсаулығы</div><div class="v" style="color:${verdict[1]};font-size:24px">${verdict[0]}</div><div class="s" style="line-height:1.4;margin-top:4px">${verdict[2]}</div></div></div></div>
  ${top.length?`<div class="sec">Ең алдымен не істеу керек</div><div class="card">${top.map((f,i)=>`<div class="kv" style="align-items:flex-start;gap:10px"><b style="color:var(--muted);margin:0">${i+1}</b><span style="flex:1;color:var(--text);line-height:1.4">${f.act}</span></div>`).join("")}</div>`:""}
  <div class="sec">Толық талдау · ${F.length}</div>
  ${F.map(f=>`<div class="find ${f.lvl}"><h4>${f.title}</h4><div class="num ${f.lvl==="r"?"neg":f.lvl==="g"?"pos":f.lvl==="o"?"warn":""}">${f.num}</div>${f.meter?`<div class="meter"><i style="width:${Math.min(100,f.meter.v*100)}%;background:${f.meter.c}"></i></div>`:""}<p>${f.text}</p>${f.act?`<div class="act">${f.act}</div>`:""}</div>`).join("")}
  <p class="note">Талдау тек осы қосымшадағы деректерден есептеледі: ${pName(view)}, ${dmy(c.st)} – ${dmy(c.en)}. Шығынды неғұрлым толық жазсаңыз, талдау соғұрлым дәл болады.</p>`;
}
// ---------- settings / period ----------
function editBank(){const L=[...S.bank.log].reverse();const at=new Date(num(S.bank.at));const when=dmy(iso(at))+" "+pad(at.getHours())+":"+pad(at.getMinutes());
 openSheet("Банк шоты",`<div class="tile wide" style="margin-bottom:12px"><div class="t">Қазір банкте болу керек</div><div class="v" style="font-size:30px">${fmt(bankNow())}</div><div class="s">${when} кезінде ${fmt(S.bank.base)} деп жазылған${L.length?` · одан бері ${L.length} қозғалыс`:""}</div></div>
 ${L.length?`<div class="sec" style="margin-top:0">Одан бергі қозғалыс</div><div class="card" style="margin-bottom:12px">${L.map(x=>{const d=new Date(x.ts);return `<div class="kv"><span>${esc(x.t)}<br><small>${dShort(iso(d))} ${pad(d.getHours())}:${pad(d.getMinutes())}</small></span><b class="${x.d<0?"neg":"pos"}">${x.d>0?"+":""}${fmt(x.d)}</b></div>`}).join("")}</div>`:""}
 ${field("Kaspi/Halyk-тегі нақты сома (₸)","bAmt","","number",'placeholder="'+Math.round(bankNow())+'"')}
 <p class="note">Шығын, төлем, қарыз, жарна, жалақы қосқанда банк сомасы өзі өзгереді. Kaspi/Halyk-пен сәйкес келмесе, ондағы нақты соманы жазып «Теңестіру» басыңыз — сол сәттен бастап қайта есептеледі.</p>`,()=>{if(val("bAmt")===""){toast("Соманы жазыңыз");return false}S.bank={base:num(val("bAmt")),at:Date.now(),log:[]};toast("Банк теңестірілді")},"Теңестіру")}
function editIncome(kind){const p=S.periods[view],isSal=kind==="salary";
 openSheet(isSal?"Жалақы — "+pName(view):"Басқа кіріс — "+pName(view),`${field("Сома (₸)","iAmt",p[kind]||"","number","class='bigin' autofocus")}
 <div class="field toggle"><label style="margin:0;font-size:15px;color:var(--text)">Келесі айларға да<br><small style="color:var(--muted);font-weight:500">Алдағы айлардың болжамы да өзгереді</small></label><input type="checkbox" id="iFwd" ${isSal?"checked":""}></div>
 ${p.planned?'<p class="note">Бұл ай әлі келмеген: жалақы күні келгенде банк сомасына өзі қосылады.</p>':""}`,()=>{
  const a=num(val("iAmt"));if(!p.planned&&isNewRec(p))bankMove(a-num(p[kind]),(isSal?"Жалақы":"Басқа кіріс")+" түзетілді ("+pName(view)+")");p[kind]=a;
  if($("iFwd").checked){S.periods.forEach((q,j)=>{if(j>view&&q.planned)q[kind]=a});if(isSal)S.set.salary=a}})}
function editOpening(){openSheet("Бастапқы қалдық",field("Бірінші айдың басындағы қалдық (₸)","oAmt",S.set.opening,"number","class='bigin' autofocus")+`<p class="note">Қосымшаны бастаған айға дейін қолыңызда қалған (не жетпей тұрған) ақша. Келесі айлардың «Өткен айдан» сомасы өзі есептеледі.</p>`,()=>{S.set.opening=num(val("oAmt"))})}
function newSalary(){const t=todayIso();openSheet("Жаңа жалақы түсті",`${field("Сомасы (₸)","nsAmt",S.set.salary,"number","class='bigin' autofocus")}
 <div class="field"><label>Түскен күні</label><div style="font-size:17px;padding:2px 0">Бүгін, ${dmy(t)}</div></div>
 <p class="note">Жаңа ай басталады: өткен айдың қалдығы осыған ауысады, ай сайынғы төлемдер тізімі жаңадан басталады, сома банк шотына қосылады.</p>`,()=>{const a=num(val("nsAmt"));if(a<=0){toast("Соманы жазыңыз");return false}
  const ex=S.periods.findIndex(p=>p.start===t&&!p.planned);
  if(ex>=0){const q=S.periods[ex];if(isNewRec(q))bankMove(a-num(q.salary),"Жалақы түзетілді");q.salary=a;view=ex;toast("Бүгінгі жалақы түзетілді");return}
  let i=S.periods.findIndex(p=>p.planned);
  if(i<0){S.periods.push({start:t,salary:a,other:0});i=S.periods.length-1;initMand(t)}else rekey(i,t);
  const p=S.periods[i];p.planned=false;p.ts=Date.now();p.salary=a;bankMove(a+num(p.other),"Жалақы ("+dmy(t)+")");cascade(i+1);
  view=i;toast("Жаңа ай басталды")},"Түсті")}
function settings(){openSheet("Баптаулар",`
  <div class="card" style="margin-bottom:12px">
   <div class="row" onclick="newSalary()"><div class="ic" style="background:#16a34a">₸</div><div class="mid"><b>Жаңа жалақы түсті</b><small>Жаңа айды бастау</small></div></div>
   <div class="row" onclick="editBank()"><div class="ic" style="background:#2563eb">🏦</div><div class="mid"><b>Банк шотындағы сома</b><small>${fmt(bankNow())}</small></div></div>
  </div>
  ${field("Әдеттегі жалақы (₸)","sSal",S.set.salary,"number")}
  <div class="sec">Түсі</div>
  <div class="theme">${THEMES.map(t=>`<button class="${(S.ui.theme||"blue")===t.id?"on":""}" onclick="setTheme('${t.id}')"><i style="background:linear-gradient(135deg,${t.c[0]},${t.c[1]})"><b style="background:${t.c[2]}"></b></i>${t.name}</button>`).join("")}</div>
  <div class="sec">Деректер</div>
  <div class="card">
   <div class="row" onclick="exportJSON()"><div class="ic" style="background:#0f766e">⇩</div><div class="mid"><b>Сақтық көшірме жасау</b><small>Файлды iCloud Drive-қа сақтаңыз</small></div></div>
   <div class="row" onclick="$('fileIn').click()"><div class="ic" style="background:#7c3aed">⇧</div><div class="mid"><b>Көшірмеден қалпына келтіру</b><small>.json файлын таңдаңыз</small></div></div>
   <div class="row" onclick="exportCSV()"><div class="ic" style="background:#15803d">▦</div><div class="mid"><b>Google Sheets-ке экспорт (CSV)</b><small>Шығындар мен айлар есебі</small></div></div>
  </div>
  ${!hasW("himmet")||!hasW("students")?`<button class="btn ghost" onclick="wRestore()">Himmet / Оқушылар әмиянын қайтару</button>`:""}
  <p class="note">Барлық дерек тек осы iPhone-да сақталады, интернет пен тіркелу қажет емес. Айына бір рет сақтық көшірме жасап қойыңыз.</p>
  <button class="btn danger" onclick="resetAll()">Барлық деректі өшіру</button>
  <p class="note" style="text-align:center">Әмиян · нұсқа 1.6</p>`,()=>{S.set.salary=num(val("sSal"))})}
async function shareFile(name,text,type){const blob=new Blob([text],{type});const file=new File([blob],name,{type});if(navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file],title:name});return}catch(e){if(e.name==="AbortError")return}}const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000)}
function exportJSON(){shareFile("amiyan-"+todayIso()+".json",JSON.stringify(S,null,1),"application/json")}
function csvCell(v){v=String(v??"");return /[",;\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}
function exportCSV(){
  let out="Күні,Санат,Сипаттама,Қай ақшадан,Сома\n"+[...S.exp].sort((a,b)=>a.date.localeCompare(b.date)).map(e=>[dmy(e.date),e.cat,e.note,srcName(e),e.amount].map(csvCell).join(",")).join("\n");
  out+="\n\nКезең,Басы,Соңы,Өткен айдан,Кіріс,Ай сайынғы төлемдер,Басқа шығын,Қарыз (таза),Қалдық\n"+S.periods.map((p,i)=>{const c=calc(i);return [pName(i),dmy(c.st),dmy(c.en),c.opening,c.income,c.mand,c.other,c.loans,c.closing].map(csvCell).join(",")}).join("\n");
  shareFile("amiyan-"+todayIso()+".csv","﻿"+out,"text/csv")}
$("fileIn").onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.periods||!d.set)throw 0;if(!confirm("Қазіргі деректер көшірмедегімен ауыстырылады. Жалғастыру керек пе?"))return;S=d;save();closeSheet();view=null;render();toast("Қалпына келтірілді")}catch(err){toast("Файл дұрыс емес")}};r.readAsText(f);e.target.value=""};
function resetAll(){if(!confirm("Барлық дерек өшеді. Алдымен сақтық көшірме жасадыңыз ба?"))return;if(!confirm("Шынымен өшіру керек пе?"))return;localStorage.removeItem(KEY);S=seed();S.exp=[];S.debts=[];save();closeSheet();view=null;render()}

// ---------- түс палитралары ----------
const THEMES=[{id:"blue",name:"Көк",c:["#1f3864","#3a2a8c","#ffd666"],bar:"#1f3864"},{id:"green",name:"Жасыл",c:["#065f46","#0f766e","#fde68a"],bar:"#065f46"},{id:"sunset",name:"Шұғыла",c:["#9a3412","#be185d","#fef08a"],bar:"#9a3412"},{id:"graphite",name:"Графит",c:["#111827","#374151","#fbbf24"],bar:"#111827"}];
function applyTheme(){const id=(S.ui&&S.ui.theme)||"blue";if(id==="blue")delete document.documentElement.dataset.theme;else document.documentElement.dataset.theme=id;const m=document.querySelector('meta[name="theme-color"]');if(m)m.content=(THEMES.find(t=>t.id===id)||THEMES[0]).bar}
function setTheme(id){S.ui.theme=id;save();applyTheme();document.querySelectorAll(".theme button").forEach((b,i)=>b.classList.toggle("on",THEMES[i].id===id));render()}
// ---------- render ----------
function render(){
  applyTheme();
  ensurePeriods();
  if(view===null||view>=S.periods.length)view=curIdx();
  const t=S.ui.tab;
  $("app").innerHTML=t==="home"?vHome():t==="exp"?vExp():t==="mand"?vMand():t==="wal"?vWal():t==="anal"?vAnal():vDebt();
  renderTabs();
}
document.addEventListener("visibilitychange",()=>{if(!document.hidden){const before=S.periods.length;ensurePeriods();if(S.periods.length!==before)view=curIdx();render()}});
render();
if("serviceWorker" in navigator&&location.protocol.startsWith("http")){navigator.serviceWorker.register("sw.js").catch(()=>{})}
</script>
